<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rube Goldberg Atölyesi</title>
<style>
  :root{
    --bg:#12141a; --panel:#1b1e27; --line:#2b3040; --ink:#e7e9ee;
    --dim:#8b91a3; --acc:#ffb703; --acc2:#4cc9f0;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);
       background:radial-gradient(1200px 700px at 50% -10%,#1b2030 0%,var(--bg) 60%) fixed,var(--bg);
       font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .app{max-width:1460px;margin:0 auto;padding:20px 16px 26px}
  h1{font-size:20px;margin:0 0 2px;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 16px}

  /* Menuler tahtanin iki yanina yayiliyor: parcalar solda, kontroller sagda.
     Normalde ince bir serit halinde duruyorlar — tahtaya en genis yeri
     birakmak icin. Fare uzerine gelince acilip tahtanin USTUNE biniyorlar:
     boylece menu genislerken tuval yeniden olceklenmiyor, oyun ziplamiyor.
     Dar ekranda serit mantigi kapaniyor, paneller tahtanin altina iniyor. */
  .duzen{display:grid;gap:12px;align-items:start;
         grid-template-columns:var(--serit) minmax(0,1fr) var(--serit)}
  /* Serit genisligi renk izgarasina gore: 2 daire (24) + bosluk (6) = 54,
     bar dolgusu 2x8 -> 70. 72 verildi ki kirpilmasin. Daraltirsan renkler
     seride sigmaz ve sessizce kesilir. */
  :root{--serit:72px;--acik:212px}
  .sutun{position:relative;min-width:0;height:0}
  /* Serit KIRPILMAZ. Bir sure `max-height` + `overflow:auto` vardi ve
     kaydirma cubugu da gizliydi: sigmayan dugmeler (Tasi/Cogalt/Sil) hem
     kesiliyor hem de kesildigine dair hicbir iz birakmiyordu - dugmeler
     silinmis gibi gorunuyordu. Serit ne kadar uzunsa o kadar uzun; sigmazsa
     SAYFA kayar, bu gorunur ve tanidik bir davranis.
     Yeni panel eklerken: hicbir sey sessizce kaybolmamali. */
  .kutu{position:absolute;top:0;display:flex;flex-direction:column;gap:8px;
        width:var(--serit);z-index:20;transition:width .16s ease}
  .sol .kutu{left:0}
  .sag .kutu{right:0}
  .kutu:hover,.kutu:focus-within{width:var(--acik)}
  /* Hover'i olmayan cihazda (parmak) serit KENDILIGINDEN ACIK durur: acmanin
     baska yolu yok, kapali seritte yalnizca ikonlar var ve oyuncu neye
     bastigini goremez. 1120 px altinda paneller zaten tahtanin altina
     iniyor, yani bu kural pratikte tablet/dokunmatik ekran icin. */
  @media (hover:none){
    .kutu{width:var(--acik)}
  }
  /* Balon dugmelerin alt govde golgesi 4 px asagi tasiyor: aralik ona gore
     (dugmeler birbirinin golgesine binmesin), padding de alt tarafta fazla. */
  .sutun .bar{flex-direction:column;align-items:stretch;gap:7px;margin:0;
              padding:7px 8px 10px;overflow:hidden}
  /* Sabit yukseklik: metin gizlenince dugme kisaliyor, panel acilirken
     asagidaki dugmeler imlecin altindan kayiyordu. (Renk daireleri
     .renkler icinde, dogrudan cocuk olmadiklari icin etkilenmiyor.) */
  .sutun .bar>button{justify-content:flex-start;width:100%;height:28px;
                     padding:0 9px;white-space:nowrap;gap:9px}
  /* Ikon kutusu flex olmali: icine konan renk noktasi inline span icinde
     olcu almiyor, ince bir cizgiye donuyordu. */
  .im{flex:none;width:16px;display:inline-flex;align-items:center;justify-content:center}
  /* Kontrol panelinin ikinci bolumu (enstruman): ayni dugme olculeri, arada
     ince bir ayirac. Ayri panel yapmak seridi gereksiz uzatiyordu. */
  .ic{display:flex;flex-direction:column;gap:7px}
  .sutun .ic>button{justify-content:flex-start;width:100%;height:28px;
                    padding:0 9px;white-space:nowrap;gap:9px}
  .kutu:not(:hover):not(:focus-within) .ic>button{justify-content:center;padding:0}
  .ayirac{height:1px;background:var(--line);margin:2px 4px}
  .ad{overflow:hidden;text-overflow:ellipsis}
  /* Serit halindeyken yalnizca ikonlar gorunur. Metin disinda kalan her sey
     `visibility` ile gizleniyor, `display:none` ile DEGIL: acilirken dugmeler
     dikeyde kaymasin diye yerleri korunmali — yoksa fare bir dugmeye yaklasip
     panel acildiginda dugme imlecin altindan kayiyor, yanlis dugmeye basiliyor. */
  .kutu:not(:hover):not(:focus-within) .ad{display:none}
  .kutu:not(:hover):not(:focus-within) .baslikcik{visibility:hidden}
  /* Bunlar en altta ve altlarinda dugme yok: yerlerini korumak gerekmiyor,
     tamamen kalkip seridi kisaltabilirler. */
  .kutu:not(:hover):not(:focus-within) #altBar{display:none}
  .kutu:not(:hover):not(:focus-within) .bar>button{justify-content:center;padding:0}
  .sutun .spacer{display:none}
  .sutun select{margin:2px 0 0;width:100%}
  /* Serit halindeyken yeri korunuyor (gorunmez ama duruyor); sarmasin diye
     nowrap — yoksa 40 px'e sikisip uc satira cikiyor ve seridi uzatiyordu. */
  .sutun .sayac{margin:2px 0 0;text-align:center;white-space:nowrap}
  .baslikcik{font-size:11px;letter-spacing:.8px;text-transform:uppercase;
             color:var(--dim);margin:1px 2px 3px;white-space:nowrap}
  /* Kisa ekranlarda serit tahtadan uzun kalip sayfayi kaydiriyordu. Cozum
     GIZLEMEK degil KUCULTMEK: dugme yuksekligi, araliklar ve dolgular
     pencere yuksekligine gore kademe kademe iniyor. Iki durumda da (kapali/
     acik) ayni olculer gecerli, yani acilirken dugmeler yine kaymiyor. */
  @media (max-height:860px){
    .sutun .bar>button,.sutun .ic>button{height:26px}
    .sutun .bar{gap:5px;padding:6px 8px 8px}
    .kutu{gap:6px}
    .baslikcik{margin:0 2px 2px}
  }
  @media (max-height:770px){
    .sutun .bar>button,.sutun .ic>button{height:24px;gap:7px}
    .sutun .bar{gap:4px;padding:5px 8px 7px}
    .kutu{gap:5px}
    .renkler{gap:4px}
    .app{padding:14px 16px 18px}
    h1{font-size:18px}
    .sub{margin-bottom:10px}
  }
  @media (max-height:690px){
    .sutun .bar>button,.sutun .ic>button{height:22px}
    .sub{display:none}
  }

  @media (max-width:1120px){
    .duzen{grid-template-columns:minmax(0,1fr)}
    .sutun{height:auto}
    .kutu{position:static;width:auto;flex-direction:row;flex-wrap:wrap}
    .kutu>div{flex:1 1 320px}
    .sutun .bar{flex-direction:row;align-items:center;flex-wrap:wrap}
    .sutun .bar button{width:auto}
    .baslikcik{display:none}
    .sol{order:2}
  }

  /* Menuler: yuzen cam paneller */
  .bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:10px;
       background:linear-gradient(180deg,#1c2029cc,#161a22cc);border:1px solid var(--line);
       border-radius:14px;padding:8px 10px;
       box-shadow:0 1px 0 #ffffff0a inset,0 8px 22px #00000055}
  /* Balon dugmeler: yuvarlak, sisman, ustten isik alan. Alt kenardaki koyu
     govde golgesi "kalinlik" veriyor; basilinca dugme o golgenin uzerine
     oturuyor (asagi iner + golge kisalir), yani basma hissi renkten degil
     GEOMETRIDEN geliyor. */
  button{font:inherit;color:var(--ink);
         background:linear-gradient(180deg,#39405a 0%,#2a3044 45%,#222739 100%);
         border:1px solid #454d69;border-radius:999px;padding:9px 16px;cursor:pointer;
         display:inline-flex;align-items:center;gap:8px;font-weight:600;
         box-shadow:0 2px 0 #ffffff1f inset,0 -3px 6px #00000055 inset,
                    0 4px 0 #12151f,0 7px 14px #00000066;
         transition:transform .1s cubic-bezier(.3,1.6,.5,1),box-shadow .1s,filter .12s}
  button:hover{filter:brightness(1.14) saturate(1.05);transform:translateY(-1px);
               box-shadow:0 2px 0 #ffffff28 inset,0 -3px 6px #00000055 inset,
                          0 5px 0 #12151f,0 10px 18px #00000070}
  button:active{transform:translateY(3px);
                box-shadow:0 2px 0 #ffffff14 inset,0 -2px 5px #00000055 inset,
                           0 1px 0 #12151f,0 2px 6px #00000066}
  button.on{background:linear-gradient(180deg,#ffe08a 0%,#ffc22e 45%,#f0a000 100%);
            color:#3a2600;border-color:#ffe9a8;
            box-shadow:0 2px 0 #ffffff9c inset,0 -3px 7px #b8760066 inset,
                       0 4px 0 #a86f00,0 7px 18px #ffb70366}
  button.on:active{box-shadow:0 2px 0 #ffffff9c inset,0 -2px 5px #b8760066 inset,
                              0 1px 0 #a86f00,0 2px 8px #ffb70366}
  button.primary{background:linear-gradient(180deg,#9beeff 0%,#45c4ee 45%,#1ba2d6 100%);
                 color:#00232f;border-color:#b6f2ff;
                 box-shadow:0 2px 0 #ffffffa8 inset,0 -3px 7px #0a6a8f66 inset,
                            0 4px 0 #0d6f96,0 7px 18px #4cc9f066}
  button.primary:active{box-shadow:0 2px 0 #ffffffa8 inset,0 -2px 5px #0a6a8f66 inset,
                                   0 1px 0 #0d6f96,0 2px 8px #4cc9f066}
  button:disabled{opacity:.42;cursor:not-allowed;filter:none;transform:none;
                  box-shadow:0 2px 0 #ffffff10 inset,0 3px 0 #12151f}
  /* Serit halinde parcayi ayirt eden tek sey bu nokta, o yuzden iri ve koyu
     halkali: secili (sari) dugmede de secilebilsin. Olcusu iki durumda da
     ayni — degisseydi dugme yuksekligi, dolayisiyla acilirken dugmelerin
     yeri degisirdi. */
  .nokta{width:13px;height:13px;border-radius:50%;box-shadow:0 0 7px currentColor;
         background:currentColor;flex:none;border:2px solid #0e1015aa}
  select{font:inherit;color:var(--ink);background:linear-gradient(180deg,#242938,#1b1f2a);
         border:1px solid var(--line);border-radius:10px;padding:7px 9px;margin-left:10px;
         cursor:pointer}
  .spacer{flex:1}
  .sayac{font-size:12px;color:var(--dim);margin-left:4px}

  /* Nota menusu */
  #notaMenu{position:fixed;display:none;z-index:50;min-width:322px;padding:10px;
            background:linear-gradient(180deg,#20242f,#171a23);border:1px solid #39415a;
            border-radius:14px;box-shadow:0 18px 40px #000a}
  .notaBas{font-size:12px;color:var(--dim);margin:0 2px 8px}
  /* Yedi sutun: diyatonik dizide oktav basina tam yedi nota var, yani her
     SATIR bir oktav oluyor ve ayni harf hep ayni sutunda kaliyor. Sutun
     sayisi dizinin uzunluguna bagli - degistirilirse burasi da degisir. */
  .notaIzgara{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .notaIzgara button{justify-content:center;padding:7px 0;font-size:12px}
  /* Orta bandin disindaki oktavlar biraz soluk: menude once C4-A5 arasi
     goze carpsin, bas/tiz uclar arayanin bulacagi yerde dursun. */
  .notaIzgara button.uzakOktav{opacity:.62}
  .menuAlt{margin-top:9px;padding-top:9px;border-top:1px solid #39415a}
  .menuAlt button{width:100%;justify-content:center;font-size:13px}
  /* Tahta genisledikce yukselir; ekrandan tasmasin diye eni, kalan YUKSEKLIGE
     gore de sinirlaniyor (1000/640 en-boy orani sabit). */
  .wrap{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
        background:#0e1015;max-width:calc((100vh - 190px) * 1000 / 640);margin:0 auto}
  /* Alan rengi secicisi: renk daireleri */
  /* Sabit 2 sutun: serit acilirken yeniden dizilseydi renkler imlecin
     altindan kayardi. Ayrica serit halinde 5 satir yer kaplamiyor. */
  .renkler{display:grid;grid-template-columns:repeat(2,24px);gap:6px;
           justify-content:center}
  .renkler button{width:24px;height:24px;padding:0;border-radius:50%;flex:none;
                  justify-content:center;background:var(--ornek);
                  box-shadow:0 2px 6px #0006}
  .renkler button.on{border-color:#ffd45e;box-shadow:0 0 0 2px #ffb70366,0 2px 8px #0007;
                     background:var(--ornek);font-weight:400}
  canvas{display:block;width:100%;height:auto;touch-action:none}
  .ust{position:absolute;inset:0;display:none;place-items:center;
       background:rgba(10,12,17,.82);text-align:center;padding:20px}
  .ust.gor{display:grid}
  .ust h2{margin:0 0 6px;font-size:26px}
  .ust p{margin:0 0 16px;color:var(--dim);max-width:420px}
  .ipuc{color:var(--dim);font-size:13px;margin-top:10px;min-height:20px}
  .ipuc b{color:var(--ink);font-weight:600}

  /* Misafir seridi: baskasinin linkiyle acilan makine. Tahtanin USTUNDE
     duruyor ve kendini gizlemiyor - oyuncunun kendi kaydinin ustune
     yazilmadigini bilmesi gerek, yoksa "makinem gitti" sanir. */
  .misafir{display:none;align-items:center;gap:10px;flex-wrap:wrap;
           margin-bottom:10px;padding:9px 12px;border-radius:12px;
           border:1px solid #6b4d12;background:#2a2110;font-size:13px}
  .misafir.gor{display:flex}
  .misafir .yazi{flex:1 1 220px;min-width:0;color:var(--ink)}
  .misafir button{height:28px;padding:0 12px;flex:none}
  /* Link kutusu: pano yazma izni yoksa oyuncu elle kopyalasin diye
     gorunur ve secili duruyor. Gizli input KOPYALANAMAZ - bir kez
     denendi, Safari secimi bos gecti. */
  .baglanti{display:none;width:100%;margin-top:8px;padding:7px 9px;
            border-radius:9px;border:1px solid var(--line);
            background:#0e1017;color:var(--ink);font-size:12px;
            font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .baglanti.gor{display:block}
</style>
</head>
<body>
<div class="app">
  <h1>Rube Goldberg Atölyesi</h1>
  <p class="sub">Basit bir işi gereksiz yere karmaşık yap: topu zile ulaştır.</p>

  <div class="duzen">
    <aside class="sutun sol">
      <div class="kutu">
        <div>
          <div class="baslikcik" id="bsParcalar">Parçalar</div>
          <div class="bar" id="paletBar"></div>
        </div>
        <div>
          <div class="baslikcik" id="bsYakin">Yakınlaştırma</div>
          <div class="bar" id="yakinBar"></div>
        </div>
      </div>
    </aside>

    <main>
      <div class="misafir" id="misafirBar">
        <span class="yazi" id="misafirYazi"></span>
        <button class="primary" id="misafirAl"></button>
        <button id="misafirBirak"></button>
      </div>
      <div class="wrap">
        <canvas id="cv" width="1000" height="640"></canvas>
        <div class="ust" id="ust">
          <div>
            <h2 id="ustBaslik">Zil çaldı!</h2>
            <p id="ustMetin"></p>
            <button class="primary" id="ustBtn">Devam</button>
          </div>
        </div>
      </div>
      <p class="ipuc" id="ipuc"></p>
      <input class="baglanti" id="baglantiKutu" readonly aria-label="link">
    </main>

    <aside class="sutun sag">
      <div class="kutu">
        <div>
          <div class="baslikcik" id="bsBolumler">Bölümler</div>
          <div class="bar" id="bolumBar"></div>
        </div>
        <div>
          <div class="baslikcik" id="bsKontrol">Kontroller</div>
          <div class="bar">
            <button class="primary" id="basla"></button>
            <button id="sifirla"></button>
            <button id="temizle"></button>
            <button id="kayit"></button>
            <button id="paylasBtn"></button>
            <button id="sesBtn"></button>
            <button id="ucBtn"></button>
            <div class="ayirac"></div>
            <div id="calgiBar" class="ic"></div>
            <div class="ayirac"></div>
            <div id="ornekBar" class="ic"></div>
            <div class="ayirac"></div>
            <div class="renkler" id="renkBar"></div>
          </div>
        </div>
        <!-- Sayac ve dil en sonda: seritte tamamen gizleniyorlar, altlarinda
             baska dugme olmadigi icin gizlenmeleri hicbir seyi kaydirmiyor. -->
        <div class="bar" id="altBar">
          <span class="sayac" id="sayac"></span>
          <select id="dilSec" aria-label="language"></select>
        </div>
      </div>
    </aside>
  </div>
</div>

<div id="notaMenu"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 *  Kucuk 2B fizik + parca kayit defteri.
 *
 *  Motor hicbir parca turunu ISMEN bilmez. Her parca asagidaki
 *  PARCALAR defterinde kendi geometrisini, topla etkilesimini, kendi
 *  hareketini ve cizimini tanimlar; motor yalnizca bu kancalari cagirir.
 *  Yeni parca eklemek = deftere tek blok yazmak.
 * ------------------------------------------------------------------ */

const G = 1500;            // yercekimi px/s^2
const ADIM = 1 / 480;      // sabit fizik adimi
const TOP_R = 13;

const cv = document.getElementById("cv");
// Kayit modunda cizim gecici olarak dikey tuvale yonlendiriliyor; bu yuzden
// ctx sabit degil. Tum cizim kodu bu degiskeni okur.
let ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;

/* ---------- vektor yardimcilari ---------- */
const v = (x, y) => ({ x, y });
const ekle = (a, b) => v(a.x + b.x, a.y + b.y);
const cikar = (a, b) => v(a.x - b.x, a.y - b.y);
const carp = (a, k) => v(a.x * k, a.y * k);
const nokta = (a, b) => a.x * b.x + a.y * b.y;
const boy = a => Math.hypot(a.x, a.y);

/** P noktasinin AB dogru parcasina en yakin noktasi. */
function enYakin(p, a, b) {
  const ab = cikar(b, a);
  const uz2 = nokta(ab, ab) || 1;
  const t = Math.max(0, Math.min(1, nokta(cikar(p, a), ab) / uz2));
  return { nok: ekle(a, carp(ab, t)), t };
}

function cizgi(a, b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }

/* ================================================================== *
 *  PARCA KAYIT DEFTERI
 *
 *  Kanca            | Ne zaman cagrilir
 *  -----------------|--------------------------------------------------
 *  olustur(a, b)    | tuvale yerlestirilirken (a: tiklama, b: birakma)
 *  geometri(p)      | her adimda; [nokta, nokta] dondurur - carpisma
 *                   | bunun uzerinden olur. null = katı degil (alan etkisi)
 *  carpma(p,c,dt)   | top bu parcaya degdiginde. c = {n, vn, t}
 *  adim(p,dt,ort)   | her adimda, parcanin kendi hareketi
 *  ciz(p)           | her karede
 *  sifirla(p)       | calistir/durdur - denemeye baslamadan onceki hal
 *  sekil            | dondurulup uzatilabilen parcalarin olculeri:
 *                   | {uzun, enAz, enCok, doner} — tutamaklar bundan uretilir
 *
 *  SEKIL SOZLESMESI: parcanin acisi p.yon (radyan, 0 = yatay), yari boyu
 *  p.uzun. Ikisi de opsiyonel; yoksa sekil.uzun ve 0 kullanilir. Fizik ve
 *  cizim asagidaki yardimcilardan gecerse parca dondurulunce davranisi da
 *  doner (firlatici kendi normali boyunca atar, konveyor kendi ekseninde
 *  tasir). Yeni parca eklerken tek yapilacak sey bunlari kullanmak.
 * ================================================================== */

const yonu  = p => p.yon || 0;
const uzunu = p => (p.uzun != null ? p.uzun : (PARCALAR[p.tur].sekil || {}).uzun || 40);
/** Parcanin kendi ekseni (yon=0 iken saga dogru). */
const eksen = p => v(Math.cos(yonu(p)), Math.sin(yonu(p)));
/** Parcanin ust yuzunun normali (yon=0 iken yukari). */
const dikey = p => v(Math.sin(yonu(p)), -Math.cos(yonu(p)));
/** Eksen boyunca iki uc nokta — cogu parcanin geometrisi bu. */
function ucNoktalar(p) {
  const d = carp(eksen(p), uzunu(p));
  return [cikar(p.p, d), ekle(p.p, d)];
}
/** Parcanin yerel eksenine gecer; ciz() icinde kullanilir. */
function yerelde(p, ic) {
  ctx.save();
  ctx.translate(p.p.x, p.p.y);
  ctx.rotate(yonu(p));
  ic(uzunu(p));
  ctx.restore();
}

const PARCALAR = {

  /* ---- bolum geometrisi (oyuncu koyamaz) ---- */
  wall: {
    geometri: p => [p.a, p.b],
    ciz(p) { ctx.strokeStyle = "#39415a"; ctx.lineWidth = 10; cizgi(p.a, p.b); },
  },

  bell: {
    hedef: true,
    ciz(p) {
      const r = p.r + (p.parla > 0 ? 6 : 0);
      ctx.fillStyle = p.calan ? "#5ddc8a" : "#ffd166";
      ctx.beginPath(); ctx.arc(p.p.x, p.p.y, r, Math.PI, 0); ctx.fill();
      ctx.fillRect(p.p.x - r, p.p.y, r * 2, 5);
      ctx.fillStyle = "#0e1015";
      ctx.beginPath(); ctx.arc(p.p.x, p.p.y + 9, 4, 0, 7); ctx.fill();
      if (p.parla > 0) p.parla -= 0.02;
    },
  },

  /* ---- oyuncunun koyabildigi parcalar ---- */
  ramp: {
    ad: "Rampa", renk: "#6ea8fe", palet: true, surukleyle: true,
    ipuc: "Tuvale <b>sürükle</b> — çizdiğin doğru bir rampa olur. Kısa tıklama düz rampa koyar.",
    olustur(a, b) {
      return boy(cikar(b, a)) > 24

  domino: {
    ad: "Domino", renk: "#ffb703", palet: true,
    ipuc: "Tıkla — domino diker. Devrilince yanındakini de devirir, aralarını 40-50 px tut.",
    // Domino tabanindan sabit: tek tutamak ucta, egimi (yon) ve boyu birlikte
    // ayarliyor. Burada aci dikeyden olculuyor, yon de oyle.
    sekil: { uzun: 54, enAz: 26, enCok: 130, doner: true, mod: "taban" },
    olustur: a => ({ tur: "domino", p: a, aci: 0, aciHiz: 0 }),
    geometri: p => [p.p, v(p.p.x + Math.sin(p.aci) * uzunu(p),
                           p.p.y - Math.cos(p.aci) * uzunu(p))],
    carpma(p, c) {
      // Devrilme yonu topun hizindan degil, hangi TARAFTAN dokunuldugundan
      // cikiyor: yukaridan dusen hizli top cubugu icine dogru itmemeli.
      const yon = -Math.sign(c.n.x) || Math.sign(bilye.h.x) || 1;
      const guc = Math.min(6, (Math.abs(bilye.h.x) + Math.abs(bilye.h.y) * 0.5) / 260);
      if (Math.abs(p.aciHiz) < 0.2) p.aciHiz += yon * guc;
    },
    adim(p, dt, ort) {
      if (Math.abs(p.aci) > 0.001 || Math.abs(p.aciHiz) > 0.001) {
        p.aciHiz += (3 * G / (2 * uzunu(p))) * Math.sin(p.aci) * dt;   // mafsalli cubuk
        p.aci += p.aciHiz * dt;
        const yat = Math.PI / 2 * 0.95;
        if (Math.abs(p.aci) > yat) { p.aci = Math.sign(p.aci) * yat; p.aciHiz = 0; }
      }
      if (Math.abs(p.aci) <= 0.15) return;
      const uc = PARCALAR.domino.geometri(p)[1];
      for (const q of ort.parcalar) {                     // komsuyu devir
        if (q === p || q.tur !== "domino") continue;
        const { nok } = enYakin(uc, ...PARCALAR.domino.geometri(q));
        if (boy(cikar(uc, nok)) < 10 && Math.abs(q.aciHiz) < Math.abs(p.aciHiz)) {
          q.aciHiz += Math.sign(p.aci) * Math.abs(p.aciHiz) * 0.55;

      if (boy(cikar(uc, ort.zil.p)) < ort.zil.r + 8) ort.zilCal();   // ucu zile degdi
    },
    sifirla(p) { p.aci = yonu(p); p.aciHiz = 0; },   // egik dikildiyse oyle dursun
    ciz(p) {
      const [a, b] = PARCALAR.domino.geometri(p);
      ctx.strokeStyle = "#ffb703"; ctx.lineWidth = 13; cizgi(a, b);
      ctx.fillStyle = "#0e1015"; ctx.beginPath(); ctx.arc(a.x, a.y, 3, 0, 7); ctx.fill();
    },
  },

  seesaw: {
    ad: "Tahterevalli", renk: "#c77dff", palet: true,
    ipuc: "Tıkla — ortadan mafsallı kaldıraç. Topun düştüğü uç aşağı iner.",

    sekil: { uzun: 78, enAz: 34, enCok: 170, doner: false },
    olustur: a => ({ tur: "seesaw", p: a, aci: 0, aciHiz: 0 }),
    geometri(p) {
      const d = v(Math.cos(p.aci) * uzunu(p), Math.sin(p.aci) * uzunu(p));
      return [cikar(p.p, d), ekle(p.p, d)];

    carpma(p, c, dt) {

      const kol = nokta(cikar(bilye.p, p.p), v(Math.cos(p.aci), Math.sin(p.aci)));

    adim(p, dt) {
      p.aciHiz += -Math.sin(p.aci) * 2.2 * dt;       // hafif geri cagirma
      p.aciHiz *= 0.9995;
      p.aci += p.aciHiz * dt;
      const sinir = 0.62;
      if (Math.abs(p.aci) > sinir) { p.aci = Math.sign(p.aci) * sinir; p.aciHiz *= -0.2; }
    },
    sifirla(p) { p.aci = 0; p.aciHiz = 0; },
    ciz(p) {
      const [a, b] = PARCALAR.seesaw.geometri(p);
      ctx.strokeStyle = "#c77dff"; ctx.lineWidth = 10; cizgi(a, b);
      ctx.fillStyle = "#8e5bd0";
      ctx.beginPath(); ctx.moveTo(p.p.x - 12, p.p.y + 22); ctx.lineTo(p.p.x + 12, p.p.y + 22);

  fan: {

    sekil: { uzun: 46, enAz: 22, enCok: 120, doner: true },
    olustur: a => ({ tur: "fan", p: a, faz: 0 }),
    geometri: () => null,                     // kati degil: alan etkisi
    adim(p, dt, ort) {
      p.faz += dt * 9;
      const b = ort.bilye;
      if (!b) return;
      // Sutun parcanin normali boyunca uzaniyor; dondurulunce yana ufler.
      const n = dikey(p), t = eksen(p);
      const bag = cikar(b.p, p.p);
      const ileri = nokta(bag, n), yan = nokta(bag, t);
      if (Math.abs(yan) < uzunu(p) && ileri > 0 && ileri < 300) {
        b.h = ekle(b.h, carp(n, 2600 * dt * (1 - ileri / 380)));  // uzaklastikca zayif
        b.h = ekle(b.h, carp(t, -yan * 0.4 * dt));                // sutunun ortasina topla

      yerelde(p, u => {

        ctx.lineTo(u * 0.65, -300); ctx.lineTo(-u * 0.65, -300);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "#7ee8fa"; ctx.lineWidth = 5;
        cizgi(v(-u * 0.57, 6), v(u * 0.57, 6));
        for (let i = 0; i < 3; i++) {
          const y = -30 - ((p.faz * 26 + i * 60) % 180);
          ctx.strokeStyle = "#7ee8fa88"; ctx.lineWidth = 3;
          cizgi(v(-12, y + 8), v(0, y));
          cizgi(v(12, y + 8), v(0, y));

  magnet: {
    ad: "Mıknatıs", renk: "#f4a261", palet: true,
    ipuc: "Tıkla — 170 px menzilde topu kendine çeker. Yörünge kurmak için birden fazla koy.",

    sekil: { uzun: 170, enAz: 70, enCok: 340, doner: false, mod: "menzil" },
    olustur: a => ({ tur: "magnet", p: a }),
    geometri: () => null,
    adim(p, dt, ort) {

/* Doner tabla: kendi merkezinde surekli donen bir platform. Duran topu
 * ustunde tasir, uc kisminda savurur. Iki yonu ayni koddan uretiliyor. */
const TABLA_HIZ = 5.5;          // rad/s — uc hizi ~ TABLA_HIZ * uzunluk
const TABLA_TUTUS = 30;         // yuzey surtunmesi: topu ne cabuk kendine katar

/** Tablanin o andaki acisi: tutamakla verilen yon + donusun fazi. */
const tablaAci = p => yonu(p) + (p.faz || 0);
function tablaUclar(p) {
  const a = tablaAci(p);
  const d = v(Math.cos(a) * uzunu(p), Math.sin(a) * uzunu(p));
  return [cikar(p.p, d), ekle(p.p, d)];
}

function donerTabla(yon, ad) {
  return {
    ad, renk: "#ff6b9d", palet: true, ceviriGrup: "spin",
    ipuc: "Tıkla — kendi merkezinde döner. Üstündeki topu döndüğü yöne taşır, ucunda savurur.",
    // Tutamak baslangic acisini ve yaricapi verir; donus fizigin degiskeni (faz).
    sekil: { uzun: 46, enAz: 22, enCok: 130, doner: true },
    olustur: a => ({ tur: yon > 0 ? "spinR" : "spinL", p: a, faz: 0 }),
    geometri: tablaUclar,
    carpma(p, c, dt) {
      // Temas noktasindaki yuzey hizi: w x r. Topun bu hiza gore FARKININ
      // yalnizca tegetsel bileseni uygulaniyor — normal yonu carpismanin isi.
      const r = cikar(bilye.p, p.p);
      const yuzey = carp(v(-r.y, r.x), yon * TABLA_HIZ);
      const fark = cikar(yuzey, bilye.h);
      const teg = cikar(fark, carp(c.n, nokta(fark, c.n)));
      bilye.h = ekle(bilye.h, carp(teg, Math.min(1, TABLA_TUTUS * dt)));
    },
    adim(p, dt) { p.faz = (p.faz || 0) + yon * TABLA_HIZ * dt; },
    sifirla(p) { p.faz = 0; },
    ciz(p) {
      const u = uzunu(p);
      ctx.strokeStyle = "#ff6b9d22"; ctx.lineWidth = 2;      // suprulen alan
      ctx.beginPath(); ctx.arc(p.p.x, p.p.y, u, 0, 7); ctx.stroke();
      ctx.save();
      ctx.translate(p.p.x, p.p.y);
      ctx.rotate(tablaAci(p));
      ctx.strokeStyle = "#ff6b9d"; ctx.lineWidth = 9; ctx.lineCap = "round";
      cizgi(v(-u, 0), v(u, 0));
      ctx.lineCap = "butt";
      ctx.fillStyle = "#0e1015";                             // donus okunsun diye uc noktalari
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.arc(s * (u - 7), 0, 2.6, 0, 7); ctx.fill();
      }
      ctx.restore();
      ctx.fillStyle = "#ffa8c5";                             // gobek
      ctx.beginPath(); ctx.arc(p.p.x, p.p.y, 6, 0, 7); ctx.fill();
      ctx.strokeStyle = "#0e1015"; ctx.lineWidth = 2;
      ctx.beginPath();                                       // yon oku (gobek yayi)
      ctx.arc(p.p.x, p.p.y, 11, yon > 0 ? -1.9 : 1.9, yon > 0 ? -0.2 : 0.2, yon < 0);
      ctx.stroke();
    },
  };
}

/** Iki konveyor yonu ayni koddan uretiliyor. */
function konveyor(yon, ad) {
  return {
    ad, renk: "#a0e548", palet: true, ceviriGrup: "belt",
    ipuc: "Tıkla — üstündeki topu yatay olarak taşır. Yön oku bandın üstünde.",
    sekil: { uzun: 50, enAz: 24, enCok: 160, doner: true },
    olustur: a => ({ tur: yon > 0 ? "beltR" : "beltL", p: a, faz: 0 }),
    geometri: ucNoktalar,
    carpma(p, c, dt) {
      // Tasima parcanin kendi ekseninde: egik konveyor topu yokusa surukler.
      bilye.h = ekle(bilye.h, carp(eksen(p), yon * 2400 * dt));
      bilye.h.x = Math.max(-560, Math.min(560, bilye.h.x));
      bilye.h.y = Math.max(-900, Math.min(900, bilye.h.y));
    },
    adim(p, dt) { p.faz += dt * yon * 5; },
    ciz(p) {
      yerelde(p, u => {
        ctx.strokeStyle = "#a0e548"; ctx.lineWidth = 9;
        cizgi(v(-u, 0), v(u, 0));
        ctx.strokeStyle = "#0e1015"; ctx.lineWidth = 3;
        const n = Math.max(3, Math.round(u / 20));
        for (let i = 0; i < n; i++) {
          const x = -u + ((((p.faz * 20 + i * (2 * u / n)) % (2 * u)) + 2 * u) % (2 * u));
          cizgi(v(x - 4 * yon, -4), v(x + 4 * yon, 0));   // ok ucu yone baksin
          cizgi(v(x - 4 * yon, 4), v(x + 4 * yon, 0));
        }
      });
    },
  };
}

const DIL_ANAHTAR = "rube-dil";
// Varsayilan Ingilizce (hedef kitle); kullanici sectiyse onun secimi kalir.
let dil = (() => {
  try {
    const s = localStorage.getItem(DIL_ANAHTAR);
    if (s && (s in DILLER)) return s;
  } catch (e) {}
  return "en";
})();

/** Arayuz metni. */
const T = (k, ...a) => {
  const s = SOZLUK[dil] && SOZLUK[dil].ui[k];
  const m = s == null ? YEDEK_UI[k] : s;      // ceviri yoksa Turkce yedek
  return typeof m === "function" ? m(...a) : m;
};
/** Parca metni: ceviri yoksa PARCALAR'daki Turkce yedek. */
function pT(tur, alan) {
  const s = SOZLUK[dil] && SOZLUK[dil].parca;
  // Ayni koddan uretilen kardes parcalar (sag/sol konveyor gibi) ortak bir
  // ceviri blogunu paylasir; kendi blogunda olmayan alan oradan gelir.
  const grup = PARCALAR[tur].ceviriGrup;
  const ort = grup ? s && s[grup] : null;
  const c = (s && s[tur] && s[tur][alan]) || (ort && ort[alan]);
  return c || PARCALAR[tur][alan];
}
/** Bolum metni. */
function bT(i, alan) {
  const s = SOZLUK[dil] && SOZLUK[dil].bolum && SOZLUK[dil].bolum[i];
  return (s && s[alan]) || BOLUMLER[i][alan];
}

/* Serit halindeki menude yalnizca ikon gorunuyor, acilinca metin de
   geliyor. Ceviriler zaten "▶ Run", "🎬 Record…" gibi basi simgeli
   yazildigi icin ikon metinden AYRISTIRILIYOR — her dil icin ayrica ikon
   listesi tutmak gerekmiyor. Bası simgesiz olanlara yedek ikon veriliyor. */
function ikonAyir(metin, yedek) {
  const bosluk = metin.indexOf(" ");
  const bas = bosluk > 0 ? metin.slice(0, bosluk) : "";
  if (bas && !/[\p{L}\p{N}]/u.test(bas)) return { im: bas, ad: metin.slice(bosluk + 1) };
  return { im: yedek || metin.slice(0, 1), ad: metin };
}

/** Dugmeyi ikon + etiket olarak doldurur. ikon verilirse metinden ayirmaz. */
function dugmeYaz(b, metin, yedekIkon, ikon) {
  const { im, ad } = ikon ? { im: null, ad: metin } : ikonAyir(metin, yedekIkon);
  b.innerHTML = "";
  const i = document.createElement("span");
  i.className = "im";
  if (ikon) i.appendChild(ikon); else i.textContent = im;
  const a = document.createElement("span");
  a.className = "ad";
  a.textContent = ad;
  b.append(i, a);
  b.title = ad;
  return b;
}

function arayuzuTazele() {
  document.documentElement.lang = dil;

const C = () => CALGILAR[calgiAd] || CALGILAR.davul;

/** Parca turune gore tini/karakter. Bilinmeyen tur varsayilana duser. */
const TINI = {
  ramp: "naylon", domino: "susturma", seesaw: "naylon",
  launcher: "celik", trampoline: "armonik", beltR: "susturma",
  beltL: "susturma", spinR: "celik", spinL: "celik",
