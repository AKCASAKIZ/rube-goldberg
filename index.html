const SES = { ac: null, ana: null, govde: null, kayitHedef: null, acik: true,
              teller: new Map(), yuvar: null, yuvarHedef: 0, yuvarHiz: 0 };

function sesAc() {
  if (SES.ac) { if (SES.ac.state === "suspended") SES.ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  SES.ac = new AC();
  SES.ana = SES.ac.createGain();
  SES.ana.gain.value = 0.22;
  SES.ana.connect(SES.ac.destination);
  // Gitar govdesi: telin ciplak sesini kutuya sokar. Alt tepe govde
  // rezonansi, ust raf mizrabin sertligini yumusatir.
  const rez = SES.ac.createBiquadFilter();
  rez.type = "peaking"; rez.frequency.value = 210; rez.Q.value = 1.1; rez.gain.value = 5;
  const raf = SES.ac.createBiquadFilter();
  raf.type = "highshelf"; raf.frequency.value = 3200; raf.gain.value = -5;
  rez.connect(raf); raf.connect(SES.ana);
  SES.govde = rez;
  // Kayit icin ayri bir cikis: video dosyasina ses de gomulsun.
  SES.kayitHedef = SES.ac.createMediaStreamDestination();
  SES.ana.connect(SES.kayitHedef);
  yuvarlanmaKur();
}

/* Yuvarlanma sesi TEK bir surekli ses: dongulu gurultu, bant gecirenden
 * geciyor ve kazanci topun tegetsel hizini izliyor. Her temas icin yeni
 * ses baslatmak yerine tek sesi surekli beslemek hem ucuz hem de dogru:
 * yuvarlanma kesintisiz bir olay, art arda tiklama degil. */
function yuvarlanmaKur() {
  const sr = SES.ac.sampleRate;
  const ab = SES.ac.createBuffer(1, Math.round(sr * 2), sr);
  const d = ab.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const kaynak = SES.ac.createBufferSource();
  kaynak.buffer = ab; kaynak.loop = true;
  const suzgec = SES.ac.createBiquadFilter();
  suzgec.type = "bandpass"; suzgec.frequency.value = 400; suzgec.Q.value = 1.1;
  const kazanc = SES.ac.createGain();
  kazanc.gain.value = 0;
  kaynak.connect(suzgec); suzgec.connect(kazanc); kazanc.connect(SES.ana);
  kaynak.start();
  SES.yuvar = { suzgec, kazanc };
}

/** Her karede bir cagrilir: biriken temas bilgisini sese cevirir. */
function yuvarlanmaGuncelle() {
  if (!SES.yuvar) return;
  const t = SES.ac.currentTime;
  const hedef = SES.acik && calisiyor ? SES.yuvarHedef : 0;
  // setTargetAtTime: ani sicrama yerine yumusak gecis, cizirti olmasin
  SES.yuvar.kazanc.gain.setTargetAtTime(hedef * 0.5, t, 0.05);
  SES.yuvar.suzgec.frequency.setTargetAtTime(220 + SES.yuvarHiz * C().surtunme, t, 0.06);
  // Sifirlamak yerine sondurmek: top yuzeyde hafifce ziplarken temas bir
  // iki kare kopuyor, sert sifirlama sesi kesik kesik yapiyordu. Boylece
  // yuvarlanma surekli duyuluyor ama gercekten durunca ~100 ms'de bitiyor.
  SES.yuvarHedef *= 0.55;
  SES.yuvarHiz *= 0.7;
}

/* Karplus-Strong: gurultu patlamasi bir gecikme hattinda dolasirken her
 * turda tizini kaybeder — cirpilmis tel tam olarak boyle sonumlenir. */
function telUret(f, tel, sr) {

  // Sonum, dongudeki alcak gecirenin tek isi. Gurultu her saniyede f kez
  // dolastigindan sabit bir suzgec tiz notayi aninda oldururdu; onun yerine
  // suzgec HER NOTA ICIN, ses `sure` saniyede sonecek sekilde cozuluyor.
  const w = 2 * Math.PI * f / sr;
  const hedefKazanc = Math.pow(0.001, 1 / Math.max(1, f * tel.sure));
  const kazanc = a => a / Math.sqrt(1 - 2 * (1 - a) * Math.cos(w) + (1 - a) * (1 - a));
  let alt = 1e-4, ust = 0.99999;               // kazanc(a) a'da artan: ikili arama
  for (let i = 0; i < 40; i++) {
    const orta = (alt + ust) / 2;
    if (kazanc(orta) < hedefKazanc) alt = orta; else ust = orta;
  }
  const kayip = (alt + ust) / 2;

  // Perdeyi belirleyen sey hattin boyu degil, DONGUNUN toplam gecikmesi:
  // sonum suzgeci de gecikme ekliyor ve pay birakilmazsa ses pesler.
  // Toplam gecikme   tam + 1 - frak + suzgec  =  bir periyot
  // olacak sekilde hat boyu ile kesirli okuma birlikte seciliyor.
  const suzgecGecikme = (1 - kayip) / kayip;
  const hedef = Math.max(2, sr / f - suzgecGecikme - 1);
  const tam = Math.ceil(hedef), frak = tam - hedef;
  const uzunluk = Math.min(Math.round(sr * (tel.sure + 0.2)), 1 << 18);
  const cik = new Float32Array(uzunluk);

  const hat = new Float32Array(tam + 1);
  let lp = 0, ortalama = 0;
  for (let i = 0; i < hat.length; i++) {  // mizrap: alcak gecirenden gecmis gurultu
    lp += tel.parlak * (Math.random() * 2 - 1 - lp);
    hat[i] = lp;
    ortalama += lp;
  }
  // Patlamanin ortalamasi sifirlanmali: dongudeki alcak geciren DC'yi
  // aynen gecirdiginden, kalan sapma sesi yavas sonen bir ugultuya
  // bindirir ve perdeyi bulaniklastirir.
  ortalama /= hat.length;
  for (let i = 0; i < hat.length; i++) hat[i] -= ortalama;

  let i = 0, sonum = 0;
  let dcGiris = 0, dcCikis = 0;                      // cikista DC engelleyici
  for (let k = 0; k < uzunluk; k++) {
    const j = (i + 1) % hat.length;
    const y = hat[i] * (1 - frak) + hat[j] * frak;   // kesirli okuma = temiz akort
    sonum += kayip * (y - sonum);                    // telin tizi once oluyor
    hat[i] = sonum;
    dcCikis = y - dcGiris + 0.995 * dcCikis;
    dcGiris = y;
    cik[k] = dcCikis;
    i = j;
  }
  return cik;
}

/* Davul zari: sinus, ilk anda perdesi hizla dusuyor — kick/tom'un
 * "duum"unu veren sey bu dususs. Ustune vurus aninda kisa bir gurultu
 * transiyenti biniyor (deri/cubuk sesi). */
function davulUret(f, kar, sr) {
  const uzunluk = Math.round(sr * kar.sure);
  const cik = new Float32Array(uzunluk);
  const alcak = Math.min(0.99, 2 * Math.PI * kar.parlak / sr);
  let faz = 0, gLp = 0;
  for (let k = 0; k < uzunluk; k++) {
    const t = k / sr;
    const perde = f * (1 + (kar.dusus - 1) * Math.exp(-t * 42));
    faz += 2 * Math.PI * perde / sr;
    gLp += alcak * (Math.random() * 2 - 1 - gLp);     // renklendirilmis gurultu
    const zarf = Math.exp(-t * 4.6 / kar.sure);
    const gur = gLp * Math.exp(-t * 26);              // transiyent cabuk biter
    cik[k] = (Math.sin(faz) * (1 - kar.gurultu) + gur * kar.gurultu * 3) * zarf;
  }
  return cik;
}

/* Tahta cubuk (marimba): temel + dorduncu harmonik. Harmonik once
 * sonuyor, geriye yumusak temel kaliyor; basta tokmagin tak sesi var. */
function cubukUret(f, kar, sr) {
  const uzunluk = Math.round(sr * kar.sure);
  const cik = new Float32Array(uzunluk);
  for (let k = 0; k < uzunluk; k++) {
    const t = k / sr;
    const zarf = Math.exp(-t * 4.6 / kar.sure);
    const temel = Math.sin(2 * Math.PI * f * t);
    const ust = Math.sin(2 * Math.PI * f * 4 * t) * kar.harmonik * Math.exp(-t * 16);
    const tok = (Math.random() * 2 - 1) * kar.tokmak * Math.exp(-t * 320);
    cik[k] = (temel + ust) * zarf + tok;
  }
  return cik;
}

/* Secili calginin o nota+karakter icin vurus sesi. Ornek dosyasi yok;
 * her kombinasyon ilk calindiginda uretilip onbellege giriyor. */
function vurusSesi(f, karAd) {
  const anahtar = calgiAd + "|" + karAd + "|" + f.toFixed(1);
  const hazir = SES.teller.get(anahtar);
  if (hazir) return hazir;
  const calgi = C();
  const kar = calgi.karakter[karAd] || calgi.karakter[TEL_VARSAYILAN];
  const sr = SES.ac.sampleRate;
  const cik = calgi.uret(f, kar, sr);

  let tepe = 0;
  for (let k = 0; k < cik.length; k++) tepe = Math.max(tepe, Math.abs(cik[k]));
  const olcek = tepe > 0 ? 0.9 / tepe : 1;
  const cirp = Math.round(sr * 0.002);          // baslangic/bitis tikirtisini al
  const ab = SES.ac.createBuffer(1, cik.length, sr);
  const kanal = ab.getChannelData(0);
  for (let k = 0; k < cik.length; k++) {
    const ac = k < cirp ? k / cirp : 1;
    const kapa = k > cik.length - cirp * 8 ? (cik.length - k) / (cirp * 8) : 1;
    kanal[k] = cik[k] * olcek * ac * kapa;
  }
  SES.teller.set(anahtar, ab);
  return ab;
}

function notaCal(ad, guc = 1, tini = TEL_VARSAYILAN, gecikme = 0) {
  if (!SES.acik || !SES.ac) return;
  const n = NOTALAR.find(x => x.ad === ad) || NOTALAR[0];
  const kar = C().karakter[tini] ? tini : TEL_VARSAYILAN;
  const t = SES.ac.currentTime + gecikme;
  const s = SES.ac.createBufferSource();
  s.buffer = vurusSesi(n.f, kar);
  const g = SES.ac.createGain();
  g.gain.value = Math.max(0.03, Math.min(1, guc)) * C().karakter[kar].guc * 0.8;
  s.connect(g); g.connect(SES.govde || SES.ana);
  s.start(t);
}

/* Bir temasi olaya cevirir. Normal hiz (c.vn) VURUSU, tegetsel hiz
 * YUVARLANMAYI besliyor: dik gelen top tok bir vurus, yuzeyde kayan top
 * surekli bir surtunme sesi uretiyor. Ikisi ayni anda da olabilir.
 *
 * Vurus olduysa true doner — melodi takibi de bu olayi dinliyor, o yuzden
 * karar sesten BAGIMSIZ verilmeli (ses kapaliyken de melodi calismali). */
function carpmaOlayi(p, c) {
  // Tegetsel bilesen: hizin yuzeye paralel kismi
  const dik = nokta(bilye.h, c.n);
  const teg = boy(cikar(bilye.h, carp(c.n, dik)));
  const kayma = Math.min(1, teg / 900);
  if (kayma > 0.04) {
    SES.yuvarHedef = Math.max(SES.yuvarHedef, kayma);
    SES.yuvarHiz = Math.max(SES.yuvarHiz, kayma);
  }
  const guc = Math.min(1, Math.abs(c.vn) / 620);
  if (guc < 0.07) return false;                  // bu temas yalnizca yuvarlanma
  if (simT - (p.sonSes || -9) < 0.09) return false;   // ayni parca zangirdamasin
  p.sonSes = simT;
  notaCal(p.nota || NOTALAR[0].ad, guc, TINI[p.tur] || TEL_VARSAYILAN);
  return true;
}

function zilSesi() {
  if (!SES.acik || !SES.ac) return;
  // Zil = asagidan yukari sirilan bir akor.
  ["C5", "E5", "G5", "C6"].forEach((n, i) => notaCal(n, 0.85, "celik", i * 0.055));
}

/** Yeni parcaya sirayla nota ver: yan yana koyulanlar melodi olustursun.
 *  Yalnizca orta bant kullaniliyor - sebebi OTO_NOTA_ILK'in yaninda. */
function notaAta(p, sira) {
  const genislik = OTO_NOTA_SON - OTO_NOTA_ILK;
  p.nota = NOTALAR[OTO_NOTA_ILK + (sira % genislik)].ad;
}

/* ---------- melodi hedefi ---------- *
 *
 *  Melodi bolumlerinde amac zil degil: makinenin parcalari hedef notalari
 *  DOGRU SIRAYLA calmali. Beklenen nota gelince imlec ilerliyor; baska bir
 *  nota oyunu bozmuyor ama "fazla" sayiliyor ve madalyayi dusuruyor.
 *  Sifirlamak yerine fazla saymak bilincli bir tercih: tek bir sekme
 *  butun kurulusu cope atarsa oyun ogretici degil cezalandirici oluyor.
 */

let melodi = null;      // hedef nota dizisi (yoksa bolum zil bolumu)
let melodiSira = 0;     // kacinci notaya gelindi
let melodiFazla = 0;    // siraya girmeyen carpma sayisi
let basladiT = 0;       // kosunun basladigi simulasyon ani

function melodiSifirla() { melodiSira = 0; melodiFazla = 0; }

function melodiVurus(p) {
  if (!melodi || kazanildi) return;
  if (p.nota === melodi[melodiSira]) {
    melodiSira++;
    if (melodiSira >= melodi.length) melodiKazan();
  } else {
    melodiFazla++;
  }
}

function melodiKazan() { kazan(); }

/* ---------- yildizlar ---------- *
 *
 *  Zorluk bolumu gecilmez yaparak degil, YILDIZLA konuyor: bitirmek bir
 *  yildiz, hedef parca sayisinin altinda kalmak ikincisi, sure/temizlik
 *  ucuncusu. Yeni oyuncu gecebiliyor, iyi oyuncu pesine dusecek bir sey
 *  buluyor. Bolumun `yildiz` alani yoksa (Serbest) yildiz hesaplanmaz.
 */

const YILDIZ_ANAHTAR = i => "rube-yildiz-" + BOLUMLER[i].id;

function yildizOku(i) {
  try { return +localStorage.getItem(YILDIZ_ANAHTAR(i)) || 0; } catch (e) { return 0; }
}
function yildizYaz(i, n) {
  if (n <= yildizOku(i)) return;                // yalnizca en iyisi saklanir
  try { localStorage.setItem(YILDIZ_ANAHTAR(i), String(n)); } catch (e) {}
}

/** Kazanilan kosu icin {sayi, parcaTamam, ikinciTamam} dondurur. */
function yildizHesapla() {
  const h = BOLUMLER[bolumNo].yildiz;
  if (!h) return null;
  const parcaTamam = parcalar.length <= h.parca;
  const ikinciTamam = h.temiz ? melodiFazla === 0 : (simT - basladiT) <= h.sure;
  return { sayi: 1 + (parcaTamam ? 1 : 0) + (ikinciTamam ? 1 : 0), parcaTamam, ikinciTamam };
}

const yildizYazi = n => "★".repeat(n) + "☆".repeat(3 - n);

/** Hem zil hem melodi bolumunun ortak kazanma yolu. */
function kazan() {
  if (kazanildi) return;
  kazanildi = true;
  zilSesi();
  const y = yildizHesapla();
  if (y) yildizYaz(bolumNo, y.sayi);
  if (kayit) return;              // kayit sirasinda perde acilmaz
  const son = bolumNo >= BOLUMLER.length - 1;
  const h = BOLUMLER[bolumNo].yildiz;
  const metin = !y ? T("zilSon")
    : [y.parcaTamam ? null : T("yildizParca", h.parca),
       y.ikinciTamam ? null : (h.temiz ? T("yildizTemiz") : T("yildizSure", h.sure))]
      .filter(Boolean).join(" ") || T("yildizTam");
  setTimeout(() => {
    bolumBarCiz();
    ustGoster(
      (melodi ? T("melodiBaslik", "") : T("zilBaslik")) + " " + (y ? yildizYazi(y.sayi) : ""),
      metin,
      son ? T("btnDevam") : T("btnSonraki"));
  }, 420);
}

/* ================================================================== *
 *  MOTOR
 * ================================================================== */

const tanim = p => PARCALAR[p.tur];
const geometri = p => (tanim(p).geometri ? tanim(p).geometri(p) : null);
const zil = () => sabitler.find(s => s.tur === "bell");

function bolumKur(i) {
  // Bolum degistirmek misafirlikten cikar: oyuncu artik kendi kaydinda.
  // (misafirAc bunu bilerek bolumKur'dan SONRA tekrar aciyor.)
  if (misafir) { misafir = null; misafirTazele(); }
  baglantiGizle();
  bolumNo = i;
  const b = BOLUMLER[i];
  sabitler = b.sabit.map(s => ({ ...s }));
  sabitler.push({ tur: "bell", p: v(b.zil.x, b.zil.y), r: 22, calan: false, parla: 0 });
  sabitler.forEach(s => { if (!s.nota) s.nota = "C4"; });      // duvarin tok sesi
  melodi = b.melodi || null;
  melodiSifirla();
  parcalar = yukle(i) || [];
  parcalar.forEach((p, n) => { if (!p.nota) notaAta(p, n); }); // eski kayitlara nota
  kazanildi = false;
  durdur();
  paletCiz();
  bolumBarCiz();
  ustGizle();
  ipucGoster(bT(i, "metin"));
}

function stokKalan(tur) {
  const st = BOLUMLER[bolumNo].stok[tur];
  if (st === undefined) return 0;
  if (st === null) return Infinity;
  return st - parcalar.filter(p => p.tur === tur).length;
}

function basla() {
  if (calisiyor) return;
  calisiyor = true;
  kazanildi = false;
  melodiSifirla();
  basladiT = simT;                // yildiz suresi buradan olculuyor
  const z = zil();
  z.calan = false; z.parla = 0;
  parcalar.forEach(p => tanim(p).sifirla && tanim(p).sifirla(p));
  const b = BOLUMLER[bolumNo].baslangic;
  bilye = { p: v(b.x, b.y), h: v(0, 0), r: TOP_R };
  document.getElementById("basla").disabled = true;
}

function durdur() {
  calisiyor = false;
  bilye = null;
  parcalar.forEach(p => tanim(p).sifirla && tanim(p).sifirla(p));
  const z = zil();
  if (z) { z.calan = false; z.parla = 0; }
  document.getElementById("basla").disabled = false;
}

/** Topu segmente carpistirir, ic ice gecmeyi ayiklar. Degmediyse null. */
function carpisma(seg) {
  const [a, b] = seg;
  const { nok, t } = enYakin(bilye.p, a, b);
  const fark = cikar(bilye.p, nok);
  const d = boy(fark);
  if (d >= bilye.r) return null;

  const n = d > 0.0001 ? carp(fark, 1 / d) : v(0, -1);
  bilye.p = ekle(nok, carp(n, bilye.r));
  const vn = nokta(bilye.h, n);
  if (vn < 0) {
    const tang = cikar(bilye.h, carp(n, vn));
    bilye.h = ekle(carp(tang, 0.995), carp(n, -vn * 0.22));   // dusuk sekme: yuvarlansin
  }
  return { n, vn, t };
}

function temas(p, dt, oyuncunun) {
  const seg = geometri(p);
  if (!seg) return;
  const c = carpisma(seg);
  if (!c) return;
  if (carpmaOlayi(p, c) && oyuncunun) melodiVurus(p);
  if (tanim(p).carpma) tanim(p).carpma(p, c, dt);
}

let simT = 0;   // simulasyon saati (sn) — ses tekrarini kisitlamak icin

function fizikAdimi(dt) {
  simT += dt;
  bilye.h.y += G * dt;
  bilye.p = ekle(bilye.p, carp(bilye.h, dt));

  // Sabitler ve oyuncunun parcalari ayri geziliyor: melodiyi yalnizca
  // OYUNCUNUN koydugu parcalar besler, zemin/duvar carpmasi notaya sayilmaz.
  for (const p of sabitler) temas(p, dt, false);
  for (const p of parcalar) temas(p, dt, true);

  const z = zil();
  if (!z.calan && boy(cikar(bilye.p, z.p)) < z.r + bilye.r) zilCal();

  if (bilye.p.x < bilye.r) { bilye.p.x = bilye.r; bilye.h.x = Math.abs(bilye.h.x) * 0.4; }
  if (bilye.p.x > W - bilye.r) { bilye.p.x = W - bilye.r; bilye.h.x = -Math.abs(bilye.h.x) * 0.4; }
  if (bilye.p.y > H + 200) bilye = null;
}

function parcaAdimi(dt) {
  const ort = { parcalar, bilye, zil: zil(), zilCal };
  for (const p of parcalar) if (tanim(p).adim) tanim(p).adim(p, dt, ort);
}

function zilCal() {
  const z = zil();
  if (z.calan) return;
  z.calan = true; z.parla = 1;
  if (melodi) { zilSesi(); return; }     // melodi bolumunde zil sadece susleme
  kazan();
}

/* ---------- cizim ---------- */

/* 3B gorunum, ayri bir motor degil: ayni 2B sahne derinlik kazandiriliyor.
   Her parca kendi ciz() koduyla once koyulastirilmis kopyalar halinde
   kaydirilarak cizilip "kalinlik" veriliyor, ustune asil hali biniyor.
   Boylece yeni parca eklerken 3B icin ekstra kod yazmak gerekmiyor. */
let ucBoyut = false;
const UC_KAT = 8;          // extrude katman sayisi — IKININ KUVVETI olmali
const UC_DX = 0.9, UC_DY = 1.9;

/* ---------- alan rengi ---------- *
 *
 *  Tahtanin butun rengi tek bir yerden geliyor: parca kodlari renk sabiti
 *  tasimaz, zeminden okur. Yeni bir tema eklemek = asagiya bir satir.
 *    dolgu  taban rengi        izgara  duz gorunumun kilavuz cizgileri
 *    gok    3B degrade (3 durak)  ufuk  perspektif izgarasi
 *    top    bilye + golgesi     etiket  nota rozetinin zemini
 */
const ZEMINLER = {
  gece:      { ornek: "#1b2130", dolgu: "#1b2130", izgara: "#2a3245",
               gok: ["#2b3651", "#212a3d", "#171d2b"], ufuk: "#46567a",
               top: "#ffffff", topKoyu: "#c6cddf", etiket: "#161c29cc" },
  okyanus:   { ornek: "#10465a", dolgu: "#10465a", izgara: "#1c6a86",
               gok: ["#187592", "#12566c", "#0c3b4b"], ufuk: "#2f97b6",
               top: "#ffffff", topKoyu: "#bcdcea", etiket: "#0b3140cc" },
  orman:     { ornek: "#1a4029", dolgu: "#1a4029", izgara: "#265c3a",
               gok: ["#2a6d47", "#1e5131", "#133721"], ufuk: "#3d9463",
               top: "#ffffff", topKoyu: "#c2d9b6", etiket: "#0f2b1acc" },
  gunbatimi: { ornek: "#4c1f57", dolgu: "#4c1f57", izgara: "#672d73",
               gok: ["#8c3379", "#56215b", "#301337"], ufuk: "#b04f93",
               top: "#fffaf6", topKoyu: "#e6c6c1", etiket: "#33143bcc" },
  kagit:     { ornek: "#f5f3ea", dolgu: "#f5f3ea", izgara: "#dedac9",
               gok: ["#fdfcf6", "#f2efe4", "#e0dbc9"], ufuk: "#cbc6b1",
               top: "#2b2f3a", topKoyu: "#161922", etiket: "#ffffffdd" },
};
const ZEMIN_ANAHTAR = "rube-zemin";
let zeminAd = "gece";
const Z = () => ZEMINLER[zeminAd] || ZEMINLER.gece;

function zeminSec(ad) {
  if (!ZEMINLER[ad]) return;
  zeminAd = ad;
  document.querySelector(".wrap").style.background = Z().dolgu;
  try { localStorage.setItem(ZEMIN_ANAHTAR, ad); } catch (e) {}
  renkBarCiz();
}

function zemin() {
  const z = Z();
  if (!ucBoyut) {
    ctx.strokeStyle = z.izgara; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 40) cizgi(v(x, 0), v(x, H));
    for (let y = 0; y <= H; y += 40) cizgi(v(0, y), v(W, y));
    return;
  }
  const g = ctx.createLinearGradient(0, 0, 0, H);
  z.gok.forEach((c, i) => g.addColorStop([0, 0.55, 1][i], c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // perspektif izgara: dikeyler ufuk noktasina, yataylar seyrekten sika
  const ufuk = v(W / 2, -260);
  ctx.strokeStyle = z.ufuk; ctx.lineWidth = 1;
  for (let x = -W; x <= 2 * W; x += 80) cizgi(v(x, H), ufuk);
  for (let i = 1; i <= 16; i++) {
    const y = H - Math.pow(i / 16, 1.9) * (H + 120);
    cizgi(v(0, y), v(W, y));
  }
}

/* Kalinlik icin kullanilan yardimci tuval. Parcalar buraya BIR kez cizilip
   goruntu kaydirilarak basiliyor; onceki surum her katman icin butun
   parcalari yeniden ciziyor ve ustune ctx.filter kuruyordu - filtre her
   cizim isleminde ayri bir gecis baslattigi icin asil yuk oradaydi. */
const ucTuval = document.createElement("canvas");
const ucCtx = ucTuval.getContext("2d");

function parcalariCiz() {
  const hepsi = [...sabitler, ...parcalar];
  if (!ucBoyut) {
    for (const p of hepsi) tanim(p).ciz(p);
    return;
  }

  const hedef = ctx, tuval = hedef.canvas;
  if (ucTuval.width !== tuval.width || ucTuval.height !== tuval.height) {
    ucTuval.width = tuval.width; ucTuval.height = tuval.height;
  }
  ucCtx.setTransform(1, 0, 0, 1, 0, 0);
  ucCtx.clearRect(0, 0, ucTuval.width, ucTuval.height);
  // Ayni donusum: yardimci tuvale asil hedefle BIREBIR ayni sahne cizilsin
  // (yakinlastirma ve kayit kamerasi dahil).
  ucCtx.setTransform(hedef.getTransform());
  ucCtx.lineCap = "round";
  ctx = ucCtx;
  for (const p of hepsi) tanim(p).ciz(p);
  ctx = hedef;

  // Koyulastirma da tek gecis: yalnizca cizilmis piksellerin uzerine ortu.
  ucCtx.setTransform(1, 0, 0, 1, 0, 0);
  ucCtx.globalCompositeOperation = "source-atop";
  ucCtx.fillStyle = "rgba(8,10,18,0.62)";
  ucCtx.fillRect(0, 0, ucTuval.width, ucTuval.height);
  ucCtx.globalCompositeOperation = "source-over";

  // Katmanlar KENDI UZERINE kopyalanarak birikiyor: her kopyada katman
  // sayisi ikiye katlaniyor, yani 8 katman 3 kopyada cikiyor (10 kopya
  // yerine). Tam ekran kopyasi dolgu-hizi maliyeti, sayisi onemli.
  ucCtx.setTransform(1, 0, 0, 1, 0, 0);
  for (let adim = 1; adim < UC_KAT; adim *= 2) {
    ucCtx.drawImage(ucTuval, adim * UC_DX, adim * UC_DY);
  }
  hedef.save();
  hedef.setTransform(1, 0, 0, 1, 0, 0);
  hedef.drawImage(ucTuval, 0, 0);
  hedef.restore();

  hedef.save();
  hedef.shadowColor = "#000a"; hedef.shadowBlur = 14; hedef.shadowOffsetY = 4;
  for (const p of hepsi) tanim(p).ciz(p);
  hedef.restore();
}

/* Hedef melodi tahtanin ustunde: calinanlar dolu, sirasi gelen parliyor.
   Tuvale ciziliyor (arayuze degil) — boylece kayit videosunda da gorunuyor,
   izleyen makinenin neyi calmaya calistigini anliyor. */
function melodiSeridi() {
  if (!melodi) return;
  const gen = 46, bosluk = 8, yuk = 34;
  const toplam = melodi.length * gen + (melodi.length - 1) * bosluk;
  const x0 = (W - toplam) / 2, y0 = 16;
  ctx.font = "700 15px -apple-system,Segoe UI,Roboto,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let i = 0; i < melodi.length; i++) {
    const x = x0 + i * (gen + bosluk);
    const calindi = i < melodiSira, sirada = i === melodiSira && calisiyor;
    ctx.fillStyle = calindi ? "#ffc93c" : Z().etiket;
    ctx.beginPath(); ctx.roundRect(x, y0, gen, yuk, 9); ctx.fill();
    if (sirada) {
      ctx.strokeStyle = "#4cc9f0"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(x, y0, gen, yuk, 9); ctx.stroke();
    }
    ctx.fillStyle = calindi ? "#2a1d00" : "#8b91a3";
    ctx.fillText(melodi[i], x + gen / 2, y0 + yuk / 2 + 1);
  }
  if (melodiFazla > 0) {                        // fazla carpma sayaci
    ctx.font = "600 12px -apple-system,Segoe UI,Roboto,sans-serif";
    ctx.fillStyle = "#e06b6b";
    ctx.fillText("+" + melodiFazla, x0 + toplam + 26, y0 + yuk / 2 + 1);
  }
  ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
}

/** Durunca her parcanin notasi ustunde yazar — sag tikla degistirilir. */
function notaEtiketleri() {
  if (calisiyor || kayit) return;
  ctx.font = "600 11px -apple-system,Segoe UI,Roboto,sans-serif";
  ctx.textAlign = "center";
  for (const p of parcalar) {
    if (!p.nota) continue;
    const seg = geometri(p);
    const m = seg ? v((seg[0].x + seg[1].x) / 2, (seg[0].y + seg[1].y) / 2) : p.p;
    ctx.fillStyle = Z().etiket;
    ctx.beginPath();
    ctx.roundRect(m.x - 15, m.y - 30, 30, 15, 5);
    ctx.fill();
    ctx.fillStyle = tanim(p).renk || "#8b91a3";
    ctx.fillText(p.nota, m.x, m.y - 19);
  }
  ctx.textAlign = "start";
}

function ciz() {
  ctx.fillStyle = Z().dolgu;
  ctx.fillRect(0, 0, W, H);      // clearRect degil: kayit tuvalinde saydam kalmasin
  ctx.lineCap = "round";
  zemin();

  const b = BOLUMLER[bolumNo].baslangic;
  ctx.setLineDash([4, 4]); ctx.strokeStyle = Z().ufuk; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(b.x, b.y, TOP_R + 6, 0, 7); ctx.stroke();
  ctx.setLineDash([]);

  parcalariCiz();
  notaEtiketleri();
  melodiSeridi();
  tutamaklar();

  if (surukle) {
    ctx.strokeStyle = "#6ea8fe99"; ctx.lineWidth = 9;
    cizgi(surukle.a, surukle.b);
  }
  yapisIzleri();

  if (bilye) {
    if (ucBoyut) {                       // yere dusen golge
      ctx.fillStyle = "#0006";
      ctx.beginPath();
      ctx.ellipse(bilye.p.x + 5, bilye.p.y + 9, bilye.r * 1.05, bilye.r * 0.55, 0, 0, 7);
      ctx.fill();
    }
    const g = ctx.createRadialGradient(
      bilye.p.x - 4, bilye.p.y - 5, 1, bilye.p.x, bilye.p.y, bilye.r);
    g.addColorStop(0, Z().top); g.addColorStop(0.55, Z().top);
    g.addColorStop(1, Z().topKoyu);
    ctx.fillStyle = ucBoyut ? g : Z().top;
    ctx.beginPath(); ctx.arc(bilye.p.x, bilye.p.y, bilye.r, 0, 7); ctx.fill();
    if (!ucBoyut) {
      ctx.fillStyle = Z().topKoyu;
      ctx.beginPath(); ctx.arc(bilye.p.x - 4, bilye.p.y - 4, bilye.r * 0.4, 0, 7); ctx.fill();
    }
  }
}

/* ---------- gorus: yakinlastirma ve kaydirma ---------- *
 *
 *  ciz() her zaman DUNYA koordinatlarinda cizer; yakinlastirma yalnizca
 *  ekrana basarken uygulanan bir donusum. Kayit modu kendi kamerasini
 *  kurdugu icin bu donusumu gormez — video her zaman tam tahtayi cerceveler,
 *  oyuncunun o an ne kadar yakinlastirdigindan bagimsiz.
 */

const GORUS = { olcek: 1, x: 0, y: 0 };
const OLCEK_ENAZ = 0.5, OLCEK_ENCOK = 4;

/** Dunya noktasini ekranin (tuvalin) noktasina cevirir. */
const gorusKis = () => {
  const gorW = W / GORUS.olcek, gorH = H / GORUS.olcek;
  const sinirX = W - gorW, sinirY = H - gorH;      // yakinken +, uzakken -
  GORUS.x = kis(GORUS.x, Math.min(0, sinirX), Math.max(0, sinirX));
  GORUS.y = kis(GORUS.y, Math.min(0, sinirY), Math.max(0, sinirY));
};

/** Ekrandaki (tuval) bir noktayi sabit tutarak olcegi degistirir. */
function yakinlastir(carpan, merkez) {
  const eski = GORUS.olcek;
  GORUS.olcek = kis(eski * carpan, OLCEK_ENAZ, OLCEK_ENCOK);
  if (GORUS.olcek === eski) return;
  const m = merkez || v(W / 2, H / 2);             // tuval koordinati
  // Imlecin altindaki dunya noktasi yerinde kalsin
  GORUS.x += m.x / eski - m.x / GORUS.olcek;
  GORUS.y += m.y / eski - m.y / GORUS.olcek;
  gorusKis();
  yakinBarCiz();
}

function gorusSifirla() {
  GORUS.olcek = 1; GORUS.x = 0; GORUS.y = 0;
  yakinBarCiz();
}

function ekranaCiz() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = Z().dolgu;
  ctx.fillRect(0, 0, W, H);            // tahta disinda kalan bosluk da dolsun
  ctx.save();
  ctx.scale(GORUS.olcek, GORUS.olcek);
  ctx.translate(-GORUS.x, -GORUS.y);
  ciz();
  if (GORUS.olcek < 1) {               // uzaklasinca tahtanin siniri belli olsun
    ctx.strokeStyle = "#2b3040"; ctx.lineWidth = 2 / GORUS.olcek;
    ctx.strokeRect(0, 0, W, H);
  }
  ctx.restore();
}

function yakinBarCiz() {
  const bar = document.getElementById("yakinBar");
  bar.innerHTML = "";
  const dugmeler = [
    ["➖", T("uzaklas"), () => yakinlastir(1 / 1.25)],
    ["🔍", `%${Math.round(GORUS.olcek * 100)}`, gorusSifirla],
    ["➕", T("yakinlas"), () => yakinlastir(1.25)],
  ];
  for (const [im, ad, is] of dugmeler) {
    const b = document.createElement("button");
    dugmeYaz(b, im + " " + ad);
    b.onclick = is;
    bar.appendChild(b);
  }
}

// Tekerlek: imlecin altindaki noktayi sabit tutarak yakinlastir/uzaklastir.
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const m = v((e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height));
  yakinlastir(e.deltaY < 0 ? 1.12 : 1 / 1.12, m);
}, { passive: false });

/* ---------- kayit modu (dikey 1080x1920) ---------- *
 *
 *  Oyun tuvali yatay (1000x640) ama Shorts dikey istiyor. Kayit sirasinda
 *  ayni sahne gizli bir 1080x1920 tuvale, topu takip eden bir kamerayla
 *  yeniden ciziliyor: once tum tahtayi goren genis plan, sonra topa zoom.
 *
 *  Fizik burada RAF'a birakilmiyor; her karede tam 1/60 s ilerletiliyor,
 *  yani video hizi makinenin FPS'inden bagimsiz ve tekrarlanabilir.
 *  Cikti webm; mp4'e cevirmek icin repodaki mp4-yap.sh.
 */

const KAYIT = {
  gen: 1080, yuk: 1920, fps: 60,
  genisPlan: 1.6,       // sn — acilis genis plani
  zoomSure: 0.9,        // sn — genis plandan takibe gecis
  takipYuk: 620,        // takip planinda gorunen dunya yuksekligi (px)
  bitisBekle: 1.4,      // sn — zil caldiktan sonra ne kadar cekilecek
  enFazla: 45,          // sn — guvenlik siniri
};

let kayit = null;        // {rec, parcalar[], kamera...} — null = kayit yok

const rcv = document.createElement("canvas");
rcv.width = KAYIT.gen; rcv.height = KAYIT.yuk;
const rctx = rcv.getContext("2d");

const yumusa = t => t * t * (3 - 2 * t);   // smoothstep

/** Kameranin o andaki merkezi + gorunen dunya yuksekligi. */
function kamera(k, sure) {
  const genisY = KAYIT.yuk * W / KAYIT.gen;   // tahtanin tam eni sigsin (dikeyde bosluk kalir)
  const hedefY = KAYIT.takipYuk;
  let t = (sure - KAYIT.genisPlan) / KAYIT.zoomSure;
  t = yumusa(Math.max(0, Math.min(1, t)));
  const gorY = genisY + (hedefY - genisY) * t;
  const gorX = gorY * (KAYIT.gen / KAYIT.yuk);

  const hedef = bilye ? bilye.p : v(W / 2, H / 2);
  const mx = W / 2 + (hedef.x - W / 2) * t;
  const my = H / 2 + (hedef.y - H / 2) * t;
  // Yumusak takip: ani sicramalar yerine merkeze dogru sur
  k.mx += (mx - k.mx) * 0.16;
  k.my += (my - k.my) * 0.16;

  // Gorunen pencere tahtadan kucukse disari tasmasin
  let cx = k.mx, cy = k.my;
  if (gorX < W) cx = Math.max(gorX / 2, Math.min(W - gorX / 2, cx));
  else cx = W / 2;
  if (gorY < H) cy = Math.max(gorY / 2, Math.min(H - gorY / 2, cy));
  else cy = H / 2;
  return { cx, cy, olcek: KAYIT.yuk / gorY };
}

function kayitKaresi(k, sure) {
  const kam = kamera(k, sure);
  rctx.fillStyle = Z().dolgu;
  rctx.fillRect(0, 0, KAYIT.gen, KAYIT.yuk);

  const eski = ctx;
  ctx = rctx;
  rctx.save();
  rctx.translate(KAYIT.gen / 2, KAYIT.yuk / 2);
  rctx.scale(kam.olcek, kam.olcek);
  rctx.translate(-kam.cx, -kam.cy);
  ciz();
  // tahta sinirini belli et (genis planda bosluk kafa karistirmasin)
  rctx.strokeStyle = "#2b3040"; rctx.lineWidth = 2 / kam.olcek;
  rctx.strokeRect(0, 0, W, H);
  rctx.restore();
  ctx = eski;
}

function gizlendi() { if (document.hidden && kayit) kayit.iptal = true; }

async function kayitBaslat() {
  if (kayit || calisiyor) return;
  if (!parcalar.length) { ipucGoster(T("kayitParcaYok")); return; }
  // Arka plan sekmede rAF durur, MediaRecorder ise gercek saatle damga vurur:
  // kayit ya donar ya da agir cekim cikar. Bu yuzden on planda olmak sart.
  if (document.hidden) { ipucGoster(T("kayitGizli")); return; }

  const tipler = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  const tip = tipler.find(t => MediaRecorder.isTypeSupported(t));
  if (!tip) { ipucGoster(T("kayitYok")); return; }

  // captureStream(0): kareleri biz elle veriyoruz, tarayici kendi hizinda ornekleme yapmiyor.
  const akis = rcv.captureStream(0);
  const iz = akis.getVideoTracks()[0];
  // Parcalarin notalari da videoya girsin
  sesAc();
  if (SES.kayitHedef) SES.kayitHedef.stream.getAudioTracks().forEach(t => akis.addTrack(t));
  const rec = new MediaRecorder(akis, { mimeType: tip, videoBitsPerSecond: 12e6 });
  const parcalarVideo = [];
  rec.ondataavailable = e => e.data.size && parcalarVideo.push(e.data);

  const bitti = new Promise(c => { rec.onstop = c; });
  kayit = { rec, iz, k: { mx: W / 2, my: H / 2 }, dur: false };
  const dugme = document.getElementById("kayit");
  // Dugme KAPATILMIYOR, "bitir"e donuyor. Eskiden kayit yalnizca kendiliginden
  // biterdi (zil, top ekrandan cikti, 45 sn tavan) ve elle durdurmanin tek yolu
  // sekmeyi degistirmekti - o da kaydi IPTAL ediyordu, yani cekilen goruntu
  // cope gidiyordu. Top bir yerde takilip kalirsa oyuncu 45 saniye bekliyordu.
  dugmeYaz(dugme, T("kayitDurdur"));
  dugme.onclick = () => { if (kayit) kayit.dur = true; };
  document.getElementById("basla").disabled = true;

  document.addEventListener("visibilitychange", gizlendi);
  durdur(); ustGizle(); basla();
  rec.start();

  const dt = 1 / KAYIT.fps;
  let sure = 0, zilAn = null;
  while (true) {
    let kalan = dt;
    while (kalan > 0) {
      const adim = Math.min(ADIM, kalan);
      parcaAdimi(adim);
      if (bilye) fizikAdimi(adim);
      kalan -= adim;
    }
    sure += dt;
    kayitKaresi(kayit.k, sure);
    iz.requestFrame();

    if (kazanildi && zilAn === null) zilAn = sure;
    if (zilAn !== null && sure - zilAn >= KAYIT.bitisBekle) break;
    if (!bilye && !kazanildi) break;                 // top ekrandan cikti
    if (sure >= KAYIT.enFazla) break;
    if (kayit.dur) break;          // elle bitirildi - goruntu SAKLANIR
    if (kayit.iptal) break;        // sekme arka plana gecti - goruntu ATILIR

    ipucGoster(T("kayitSuruyor", sure.toFixed(1)));
    // rAF ile yaris: sekme arka plana gecerse rAF hic gelmez, o zaman
    // zaman asimi tetiklenir ve dongu iptali gorup cikabilir.
    await Promise.race([
      new Promise(requestAnimationFrame),
      new Promise(r => setTimeout(r, 400)),
    ]);
  }

  rec.stop(); await bitti; iz.stop();
  document.removeEventListener("visibilitychange", gizlendi);
  const iptal = kayit.iptal;
  kayit = null;
  durdur(); ustGizle();
  dugmeYaz(dugme, T("kayit"));
  dugme.onclick = kayitBaslat;

  if (iptal) { ipucGoster(T("kayitIptal")); return; }

  const kutu = new Blob(parcalarVideo, { type: "video/webm" });
  const ad = `rube-bolum${bolumNo + 1}-${Date.now()}.webm`;
  const url = URL.createObjectURL(kutu);
  const a = document.createElement("a");
  a.href = url; a.download = ad; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  ipucGoster(T("kayitBitti", ad));
}

/* ---------- dongu ---------- */

let sonZaman = performance.now();
requestAnimationFrame(function dongu(t) {
  const dt = Math.min(0.05, (t - sonZaman) / 1000);
  sonZaman = t;
  if (calisiyor && !kayit) {
    let kalan = dt;
    while (kalan > 0) {
      const adim = Math.min(ADIM, kalan);
      parcaAdimi(adim);
      if (bilye) fizikAdimi(adim);
      kalan -= adim;
    }
    if (!bilye && !kazanildi) {
      calisiyor = false;
      document.getElementById("basla").disabled = false;
      ustGoster(T("kayipBaslik"), T("kayipMetin"), T("btnTamam"));
    }
  }
  ekranaCiz();
  yuvarlanmaGuncelle();          // fizigin biriktirdigi temas bilgisi -> surtunme sesi
  requestAnimationFrame(dongu);
});

/* ---------- fare ---------- */

let surukle = null;

/** Cizilmekte olan rampanin serbest ucu: once baska parcalarin ucuna,
 *  tutmazsa 15 derecenin katina yapisir. Basi (surukle.a) sabit kalir. */
function surukleUcu(nok, e) {
  yapisIzSil();
  yapisTuslari(e);
  const hedefler = yapisHedefleri([]);
  const yapisik = yapistirNokta(nok, hedefler);
  if (YAPIS.iz.nokta) return yapisik;
  return yapistirAci(surukle.a, nok);
}

/** Fare olayindan DUNYA koordinati: once tuval pikseli, sonra gorus donusumu. */
function fareNok(e) {
  const r = cv.getBoundingClientRect();
  const cx = (e.clientX - r.left) * (W / r.width);
  const cy = (e.clientY - r.top) * (H / r.height);
  return v(cx / GORUS.olcek + GORUS.x, cy / GORUS.olcek + GORUS.y);
}

/** Secili aracin isi. Fare hemen pointerdown'da cagirir; parmak, uzun
    basmadan ayirt edebilmek icin BEKLETIP tap/surukleme anlasilinca cagirir. */
function eylemBasla(p, e) {
  if (secili === "sil") { silNoktada(p); return; }
  if (secili === "cogalt") { cogaltNoktada(p, e); return; }
  if (secili === "tasi") { tasimaBasla(p, e); return; }
  if (stokKalan(secili) <= 0) { ipucGoster(T("stokBitti")); return; }
  if (PARCALAR[secili].surukleyle) { surukle = { a: p, b: p }; return; }
  yeniParca(PARCALAR[secili].olustur(p, p));
}

cv.addEventListener("pointerdown", e => {
  if (e.pointerType === "touch") { dokunBasla(e); return; }
  sesAc();                       // ilk tiklamada ses motoru uyanir
  notaMenuKapat();
  if (e.button === 2) return;    // sag tik nota menusu; asagida
  if (calisiyor) return;
  eylemBasla(fareNok(e), e);
});

/** Yerlestirilen her parcaya sirasi gelen nota atanir. */
function yeniParca(p) {
  notaAta(p, parcalar.length);
  parcalar.push(p);
  kaydet(); paletCiz();
  notaCal(p.nota, 0.5, TINI[p.tur] || TEL_VARSAYILAN);   // koyarken duyulsun
}

cv.addEventListener("pointermove", e => {
  if (e.pointerType === "touch") { dokunOynat(e); return; }
  hareket(e);
});

function hareket(e) {
  if (kaydirma) {
    // Fare hangi dunya noktasini yakaladiysa orada kalsin: kayma ekran
    // pikselinden hesaplaniyor, yoksa gorus kaydikca imlec kacar.
    const r = cv.getBoundingClientRect();
    const ex = (e.clientX - r.left) * (W / r.width) / GORUS.olcek;
    const ey = (e.clientY - r.top) * (H / r.height) / GORUS.olcek;
    GORUS.x = kaydirma.son.x - ex;
    GORUS.y = kaydirma.son.y - ey;
    gorusKis();
    return;
  }
  if (kutuSecim) { kutuSecim.b = fareNok(e); return; }
  if (surukle) { surukle.b = surukleUcu(fareNok(e), e); return; }
  if (tasima) { yapisTuslari(e); tasimaSurdur(fareNok(e)); }
}

cv.addEventListener("pointerup", e => {
  if (e.pointerType === "touch") { dokunBitir(e); return; }
  birak(e);
});

function birak(e) {
  if (kaydirma) { kaydirma = null; return; }
  if (kutuSecim) {
    kutuSecim.b = fareNok(e);
    const bulunan = kutudakiParcalar(kutuSecim.a, kutuSecim.b);
    // Cok kucuk dikdortgen = bos alana tiklama, surukleme degil: secimi
    // temizlemis olur, yeni secim yapmaz.
    const kucuk = boy(cikar(kutuSecim.b, kutuSecim.a)) < 6;
    if (!kucuk) {
      secimYap(kutuSecim.ekle
        ? [...secimler, ...bulunan.filter(p => !seciliMi(p))]
        : bulunan);
      ipucGoster(secimler.length
        ? T(secimler.length > 1 ? "cokluSecili" : "tasiSecili",
            secimler.length > 1 ? secimler.length : pT(secimler[0].tur, "ad"))
        : T("tasiYok"));
    }
    kutuSecim = null;
    return;
  }
  if (tasima) { tasima = null; kaydet(); return; }
  if (!surukle) return;
  // Bitis noktasi olaydan aliniyor: hizli surukleyiste tarayici arada hic
  // pointermove uretmeyebiliyor, o zaman parca yanlis boyda cikiyordu.
  surukle.b = surukleUcu(fareNok(e), e);
  yeniParca(PARCALAR[secili].olustur(surukle.a, surukle.b));
  surukle = null;
  yapisIzSil();
}
cv.addEventListener("pointercancel", e => {
  dokunmalar.delete(e.pointerId);
  uzunBasmaIptal(); bekleyen = null; cimdik = null;
  tasima = null; surukle = null; kaydirma = null; kutuSecim = null;
});

/* ---------- dokunmatik ---------- *
 *
 *  Masaustu semasinin uc dayanagi telefonda YOK: sag tik, hover ve tekerlek.
 *  Karsiliklari:
 *    sag tik  -> UZUN BASMA (nota menusu)
 *    tekerlek -> CIMDIK (iki parmak)
 *    hover    -> CSS: @media (hover:none) seritler acik duruyor
 *
 *  Parmakta islem pointerdown'da BASLAMIYOR: basmanin tap mi, surukleme mi,
 *  uzun basma mi oldugu daha belli degil. Bekletilip anlasilinca cagriliyor.
 *  Farede boyle bir belirsizlik yok, o yol aynen duruyor.
 * ---------------------------------------------------------------- */

const DOKUN = { basiliSure: 500, kaymaEsigi: 10 };   // ms · tuval birimi
const dokunmalar = new Map();     // pointerId -> tuval noktasi
let bekleyen = null;              // { nok, tuval, olay, basladi }
let uzunBasma = null;             // setTimeout kimligi
let cimdik = null;                // { uzaklik, orta }

/** Tuval koordinati (wheel isleyicisiyle ayni olcek). */
function tuvalNok(e) {
  const r = cv.getBoundingClientRect();
  return v((e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height));
}
function uzunBasmaIptal() {
  if (uzunBasma) { clearTimeout(uzunBasma); uzunBasma = null; }
}
function cimdikDurum() {
  const [a, b] = [...dokunmalar.values()];
  return { uzaklik: Math.hypot(a.x - b.x, a.y - b.y),
           orta: v((a.x + b.x) / 2, (a.y + b.y) / 2) };
}

function dokunBasla(e) {
  dokunmalar.set(e.pointerId, tuvalNok(e));
  if (dokunmalar.size === 2) {
    // Ikinci parmak: baslamis ne varsa geri al. Yoksa cimdik yaparken
    // tahtaya parca birakiliyor ya da duran parca kayiyor.
    uzunBasmaIptal();
    if (surukle) surukle = null;
    if (tasima) tasima = null;
    kaydirma = null; bekleyen = null;
    cimdik = cimdikDurum();
    return;
  }
  if (dokunmalar.size > 2) return;
  sesAc();
  notaMenuKapat();
  if (calisiyor) return;
  bekleyen = { nok: fareNok(e), tuval: tuvalNok(e), olay: e, basladi: false };
  uzunBasma = setTimeout(() => {
    uzunBasma = null;
    if (!bekleyen) return;
    const b = bekleyen;
    bekleyen = null;
    notaMenuNoktada(b.nok, e.clientX, e.clientY);
  }, DOKUN.basiliSure);
}

function dokunOynat(e) {
  if (!dokunmalar.has(e.pointerId)) return;
  dokunmalar.set(e.pointerId, tuvalNok(e));
  if (dokunmalar.size >= 2) {
    if (cimdik) {
      const yeni = cimdikDurum();
      if (cimdik.uzaklik > 1) yakinlastir(yeni.uzaklik / cimdik.uzaklik, yeni.orta);
      cimdik = yeni;
    }
    return;
  }
  if (bekleyen && !bekleyen.basladi) {
    const t = tuvalNok(e);
    if (Math.hypot(t.x - bekleyen.tuval.x, t.y - bekleyen.tuval.y) < DOKUN.kaymaEsigi) return;
    // Parmak kaydi: uzun basma degil, surukleme. Islem BASLANGIC noktasindan
    // baslatiliyor - parmagin su anki yerinden baslatmak rampayi kisaltiyordu.
    uzunBasmaIptal();
    bekleyen.basladi = true;
    eylemBasla(bekleyen.nok, bekleyen.olay);
  }
  hareket(e);
}

function dokunBitir(e) {
  dokunmalar.delete(e.pointerId);
  if (dokunmalar.size < 2) cimdik = null;
  if (bekleyen && !bekleyen.basladi) {
    // Kisa dokunus = tiklama. Isi simdi yap ve hemen kapat: tasima araci
    // tek dokunusta parcayi SECER, surukleyle konan parca duz konur.
    uzunBasmaIptal();
    const b = bekleyen;
    bekleyen = null;
    eylemBasla(b.nok, b.olay);
    if (surukle) {
      yeniParca(PARCALAR[secili].olustur(surukle.a, surukle.a));
      surukle = null;
    }
    tasima = null;
    return;
  }
  bekleyen = null;
  birak(e);
}

/* ---------- tasima ---------- *
 *
 *  Parcalarin konumu iki bicimde tutuluyor: ya tek nokta (p) ya da iki uc
 *  (a, b — rampa). Tasima her ikisini de bilmeden calissin diye asagidaki
 *  yardimcilar parcanin sahip oldugu alanlari kaydiriyor; boylece yeni bir
 *  parca turu ayrica tasima kodu istemiyor.
 */

/* ================================================================== *
 *  YERLESTIRME YARDIMI (yapisma)
 *
 *  Elle konan parcalar hicbir zaman tam denk gelmiyordu: bir rampanin ucu
 *  digerinin ucundan 3 px asagida kalinca top araya siziyor, "neden
 *  calismiyor" sorusunun cevabi da gozle gorunmuyordu. Ayni sekilde duzgun
 *  bir merdiven kurmak icin her basamagin acisini elle tutturmak gerekiyordu.
 *
 *  Uc tur yardim var, oncelik sirasiyla:
 *    1. UC NOKTA  - surüklenen uc, baska bir parcanin ucuna/merkezine yakinsa
 *                   tam ustune oturur. Zincir boylece gercekten birlesir.
 *    2. ACI       - rampanin acisi 15 derecenin katina yakinsa ona yuvarlanir.
 *    3. HIZALAMA  - baska bir parcayla ayni x ya da y'ye yakinsa o eksene
 *                   oturur; ekranda kilavuz cizgisi cikar.
 *
 *  ALT BASILIYKEN HEPSI KAPALI. Kapatilamayan yapisma yardim degil engeldir:
 *  oyuncu bilerek 2 px kaydirmak istedigde yolu acik olmali.
 * ================================================================== */
const YAPIS = {
  nokta: 14,        // uc nokta yakalama yaricapi (dunya px)
  hiza: 6,          // ayni eksene oturma toleransi
  adim: 15 * Math.PI / 180, // aci yapismasinin basamagi
  kapali: false,    // Alt basili -> hicbir yapisma yok
  aciTusu: false,   // Shift basili -> aci 15 derecenin katina oturur
  // Son yapismanin ekranda gosterilecek izleri; her karede cizim okur.
  iz: { nokta: null, yatay: null, dikey: null, aci: null },
};

/** Yapisma hedefleri: verilen parcalar DISINDAKI her parcanin uclari ve merkezi. */
function yapisHedefleri(disinda) {
  const h = [];
  for (const p of parcalar) {
    if (disinda.includes(p)) continue;
    const seg = geometri(p);
    if (seg) { h.push(seg[0], seg[1]); }
    if (p.p) h.push(p.p);
    if (!seg && p.p && p.uzun != null) h.push(...ucNoktalar(p));
  }
  // Bolum geometrisi de hedef: duvarin ucuna dayanan rampa cok isteniyor.
  for (const p of sabitler) {
    const seg = geometri(p);
    if (seg) h.push(seg[0], seg[1]);
  }
  return h;
}

/** nok'u en yakin hedefe yapistirir. Yapismadiysa nok'u aynen dondurur. */
function yapistirNokta(nok, hedefler) {
  if (YAPIS.kapali) return nok;
  let enIyi = null, enKisa = YAPIS.nokta;
  for (const h of hedefler) {
    const d = boy(cikar(nok, h));
    if (d < enKisa) { enKisa = d; enIyi = h; }
  }
  if (!enIyi) return nok;
  YAPIS.iz.nokta = enIyi;
  return v(enIyi.x, enIyi.y);
}

/** Tek eksende hizalama: x ya da y baska bir hedefe cok yakinsa ona otur. */
function yapistirHiza(nok, hedefler) {
  if (YAPIS.kapali) return nok;
  let x = nok.x, y = nok.y;
  let enX = YAPIS.hiza, enY = YAPIS.hiza;
  for (const h of hedefler) {
    if (Math.abs(h.x - nok.x) < enX) { enX = Math.abs(h.x - nok.x); x = h.x; YAPIS.iz.dikey = h.x; }
    if (Math.abs(h.y - nok.y) < enY) { enY = Math.abs(h.y - nok.y); y = h.y; YAPIS.iz.yatay = h.y; }
  }
  return v(x, y);
}

/** Sabit ucu `kok` olan bir dogruda, serbest ucu 15 derecenin katina yuvarlar.
 *
 *  !! YALNIZCA SHIFT BASILIYKEN. Once toleransli ve kendiliginden calisiyordu
 *  (4 derece); olculdu: 360 px'lik bir rampada 4 derece ucta 25 px demek, yani
 *  oyuncunun koydugu yerden gorunur bicimde uzaga zipliyordu. Kucuk bir
 *  yardim olmasi gerekirken parcayi elinden aliyordu. Uc noktaya ve eksene
 *  yapisma kendiliginden kaliyor - onlarin kaydirmasi 14 px ile sinirli,
 *  yani hicbir zaman surpriz olmuyor. Aci ise oyuncunun ISTEDIGI an devrede:
 *  Shift basili tut, merdiven basamaklarinin acisi birebir tutar. */
function yapistirAci(kok, uc) {
  if (YAPIS.kapali || !YAPIS.aciTusu) return uc;
  const d = cikar(uc, kok);
  const uzunluk = boy(d);
  if (uzunluk < 8) return uc;
  const a = Math.atan2(d.y, d.x);
  const yuvarlak = Math.round(a / YAPIS.adim) * YAPIS.adim;
  YAPIS.iz.aci = yuvarlak;
  return v(kok.x + Math.cos(yuvarlak) * uzunluk, kok.y + Math.sin(yuvarlak) * uzunluk);
}

/** Shift/Alt durumunu FARE olayindan okur. keydown'a guvenilemez: tuvalde
 *  klavye odagi yokken tus olaylari belgeye hic ulasmayabiliyor, oysa her
 *  pointermove olayi degistiricileri zaten tasiyor. */
function yapisTuslari(e) {
  if (!e) return;
  if (typeof e.altKey === "boolean") YAPIS.kapali = e.altKey;
  if (typeof e.shiftKey === "boolean") YAPIS.aciTusu = e.shiftKey;
}

/** Her yeni surukleme adiminda izler sifirlanir - eski kilavuz ekranda kalmasin. */
function yapisIzSil() { YAPIS.iz = { nokta: null, yatay: null, dikey: null, aci: null }; }

let tasima = null;      // { p, kavrama, son: nokta } | { coklu: true, son: nokta }
let kaydirma = null;    // { son: nokta } — orta tus / Shift ile gorus kayar
let secim = null;       // tutamaklari gosterilen parca — YALNIZCA tek secimde dolu
let secimler = [];      // secili parcalarin tamami (0, 1 ya da cok)
let kutuSecim = null;   // { a, b } — bos alanda surukleyince cizilen secim dikdortgeni

/* Secim iki degiskende tutuluyor cunku iki ayri isi var: `secimler` NEYIN
 * tasinacagini, `secim` TUTAMAKLARIN kimde gosterilecegini soyluyor.
 * Tutamak yalnizca TEK parca seciliyken anlamli - iki rampanin ucunu ayni
 * anda uzatmak diye bir sey yok, ve kalabalik secimde tutamaklar birbirine
 * girip tasima tiklamasini yiyordu. Ikisini tek yerden kur. */
function secimYap(liste) {
  secimler = liste;
  secim = liste.length === 1 ? liste[0] : null;
}
const seciliMi = p => secimler.includes(p);

// Yakalama yaricaplari DUNYA biriminde; uzaklasinca ekranda kucuk kalmasin
// diye olcege bolunuyorlar, yani parmak/imlec toleransi ekranda sabit.
const UC_YAKIN = 20;    // tutamagi yakalama yaricapi (px)

/** Parmakla mi kullaniliyor? Tolerans ona gore buyuyor. */
const KABA_IMLEC = typeof matchMedia === "function"
  && matchMedia("(pointer: coarse)").matches;

/* Tolerans DUNYA biriminde tutuluyor ama oyuncu ekrandaki mesafeyi yasiyor.
   Iki sey dunyayi ekranda kucultuyor: yakinlastirma (GORUS.olcek) ve tuvalin
   CSS ile kucultulmesi (telefonda 1000 px'lik tahta ~360 px'e siger, yani
   20 birimlik tolerans 7 ekran pikseli olur - parmakla tutulmaz).
   Ikisi de min(1, …) ile giriyor: tolerans yalnizca BUYUR, hic kucultmez. */
function ekranOlcegi() {
  const g = cv.getBoundingClientRect().width;
  return g ? g / W : 1;
}
const yakalamaPayi = r =>
  (KABA_IMLEC ? r * 2.2 : r)
  / (Math.min(1, GORUS.olcek) * Math.min(1, ekranOlcegi()));
const kis = (x, a, b) => Math.max(a, Math.min(b, x));

function noktalari(p) {
  return ["p", "a", "b"].filter(k => p[k] && typeof p[k].x === "number");
}

/** Secili parcanin tutamaklari: {ad, nok, tur} — tur sadece cizim icin. */
function tutamakNoktalari(p) {
  const s = tanim(p).sekil;
  if (!s) {                                    // rampa: iki serbest uc
    return p.a && p.b
      ? [{ ad: "a", nok: p.a, tur: "uc" }, { ad: "b", nok: p.b, tur: "uc" }]
      : [];
  }
  if (s.mod === "menzil") return [{ ad: "menzil", nok: v(p.p.x + uzunu(p), p.p.y), tur: "olcu" }];
  if (s.mod === "taban") return [{ ad: "uc", nok: geometri(p)[1], tur: "uc" }];
  const [a, b] = ucNoktalar(p);
  return [{ ad: "sekil1", nok: a, tur: "uc" }, { ad: "sekil2", nok: b, tur: "uc" }];
}

function tasimaBasla(nok, e) {
  // Ctrl/Cmd: Windows'taki gibi secime EKLE / secimden CIKAR.
  const ekle = !!(e && (e.ctrlKey || e.metaKey));
  // Orta tus ya da Shift gorus kaydirir. Eskiden bos alanda SOL surukleme
  // kaydiriyordu; o hareket artik secim dikdortgenine ait, kaydirma buraya
  // tasindi. Kaydirma zaten yalnizca yakinlastirilmisken ise yariyor.
  const kaydirTusu = !!(e && (e.button === 1 || e.shiftKey));

  // Once secili parcanin tutamaklari: uzerlerine denk gelen tiklama sekil degistirir.
  if (secim && parcalar.includes(secim) && !ekle) {
    for (const t of tutamakNoktalari(secim)) {
      if (boy(cikar(nok, t.nok)) < yakalamaPayi(UC_YAKIN)) {
        tasima = { p: secim, kavrama: t.ad, son: nok };
        yakala(e);
        return;
      }
    }
  }

  const i = parcaBul(nok);
  if (i < 0) {                               // bos alan
    if (kaydirTusu) {
      kaydirma = { son: nok };
      yakala(e);
      ipucGoster(T(GORUS.olcek > 1 ? "kaydirIpuc" : "tasiYok"));
      return;
    }
    // Ctrl basili degilse eski secim dusuyor - Windows'ta bos alana tiklamak
    // secimi temizler; Ctrl ile eskisinin uzerine eklenir.
    if (!ekle) secimYap([]);
    kutuSecim = { a: nok, b: nok, ekle };
    yakala(e);
    ipucGoster(T("kutuIpuc"));
    return;
  }

  const p = parcalar[i];
  if (ekle) {                                // secime kat / cikar, tasima baslatma
    secimYap(seciliMi(p) ? secimler.filter(x => x !== p) : [...secimler, p]);
    ipucGoster(T(secimler.length > 1 ? "cokluSecili" : "tasiSecili",
                 secimler.length > 1 ? secimler.length : pT(p.tur, "ad")));
    yakala(e);
    return;
  }
  if (seciliMi(p) && secimler.length > 1) {  // secili yigini topluca tasi
    tasima = { coklu: true, son: nok };
    ipucGoster(T("cokluTasi", secimler.length));
    yakala(e);
    return;
  }
  secimYap([p]);
  tasima = { p, kavrama: "butun", son: nok };
  ipucGoster(T("tasiSecili", pT(p.tur, "ad")));
  yakala(e);
}

/** Dikdortgenle kesisen parcalar. Rampa gibi iki uclu parcalarda UC NOKTA
 *  degil PARCA testi yapiliyor: uclari kutunun disinda kalan uzun bir rampa
 *  kutunun ortasindan geciyorsa da secilmeli. */
function kutudakiParcalar(a, b) {
  const x1 = Math.min(a.x, b.x), x2 = Math.max(a.x, b.x);
  const y1 = Math.min(a.y, b.y), y2 = Math.max(a.y, b.y);
  const icinde = n => n.x >= x1 && n.x <= x2 && n.y >= y1 && n.y <= y2;
  return parcalar.filter(p => {
    const seg = geometri(p);
    if (!seg) return icinde(p.p);
    if (icinde(seg[0]) || icinde(seg[1])) return true;
    // Iki ucu da disarida: dogru parcasi kutuyu kesiyor mu? Kutunun merkezine
    // en yakin noktasi kutunun icindeyse kesiyordur.
    const orta = v((x1 + x2) / 2, (y1 + y2) / 2);
    return icinde(enYakin(orta, seg[0], seg[1]).nok);
  });
}

function yakala(e) {
  if (e && e.pointerId != null && cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
}

function tasimaSurdur(nok) {
  if (tasima.coklu) {                       // secili yigin birlikte kayiyor
    const dx = nok.x - tasima.son.x, dy = nok.y - tasima.son.y;
    tasima.son = nok;
    // Kisitlama once TUM parcalar icin hesaplanip sonra uygulaniyor: parca
    // parca kissaydi yigindaki biri tahta kenarina dayaninca digerleri
    // kaymaya devam eder ve makinenin duzeni bozulurdu.
    let sx = dx, sy = dy;
    for (const q of secimler) {
      for (const alan of noktalari(q)) {
        sx = kis(sx, -q[alan].x + 4, W - 4 - q[alan].x);
        sy = kis(sy, -q[alan].y + 4, H - 4 - q[alan].y);
      }
    }
    for (const q of secimler) {
      for (const alan of noktalari(q)) { q[alan].x += sx; q[alan].y += sy; }
      if (tanim(q).sifirla) tanim(q).sifirla(q);
    }
    return;
  }
  const p = tasima.p, k = tasima.kavrama;
  const s = tanim(p).sekil;

  if (k === "a" || k === "b") {          // tek ucu oynatiyoruz - yapisma burada
    yapisIzSil();
    const hedefler = yapisHedefleri([p]);
    // Once uc noktaya, tutmazsa acıya, o da tutmazsa hizaya bak. Sira onemli:
    // uc noktaya oturmus bir zinciri aci yuvarlamasi tekrar acmamali.
    const oburUc = k === "a" ? p.b : p.a;
    let hedef = yapistirNokta(nok, hedefler);
    if (!YAPIS.iz.nokta) {
      hedef = yapistirAci(oburUc, hedef);
      if (!YAPIS.iz.nokta) hedef = yapistirHiza(hedef, hedefler);
    }
    tasima.son = nok;
    p[k].x = kis(hedef.x, 4, W - 4);
    p[k].y = kis(hedef.y, 4, H - 4);
  } else if (k === "butun") {                              // kaydirma
    yapisIzSil();
    const dx = nok.x - tasima.son.x, dy = nok.y - tasima.son.y;
    tasima.son = nok;
    const alanlar = noktalari(p);
    let sx = dx, sy = dy;                                  // tahtadan tasmasin
    for (const alan of alanlar) {
      sx = kis(sx, -p[alan].x + 4, W - 4 - p[alan].x);
      sy = kis(sy, -p[alan].y + 4, H - 4 - p[alan].y);
    }
    for (const alan of alanlar) { p[alan].x += sx; p[alan].y += sy; }
    // Butun parca tasinirken UCLARI hedeflere hizala: yakalanan uc ne kadar
    // kaydirilmasi gerekiyorsa parcanin TAMAMI o kadar kayiyor, yani parca
    // donmuyor ya da uzamiyor - yalnizca yerine oturuyor.
    const hedefler = yapisHedefleri([p]);
    const seg = geometri(p) || [p.p];
    let duzelt = null;
    for (const u of seg) {
      const y = yapistirNokta(u, hedefler);
      if (YAPIS.iz.nokta) { duzelt = cikar(y, u); break; }
    }
    if (duzelt) for (const alan of alanlar) { p[alan].x += duzelt.x; p[alan].y += duzelt.y; }
  } else {                                                 // sekil tutamaklari
    tasima.son = nok;
    const d = cikar(nok, p.p);
    const uz = kis(boy(d), s.enAz, s.enCok);
    if (k === "menzil") {
      p.uzun = uz;
    } else if (k === "uc" && s.mod === "taban") {          // domino: aci dikeyden
      p.uzun = uz;
      p.yon = Math.atan2(d.x, -d.y);
    } else {
      p.uzun = uz;
      if (s.doner) {
        const a = Math.atan2(d.y, d.x);
        p.yon = k === "sekil1" ? a + Math.PI : a;
      }
    }
  }
  if (tanim(p).sifirla) tanim(p).sifirla(p);   // yeni sekil duruş hali olsun
}

/** Yapisma izleri: hangi eksene ve hangi noktaya oturuldugu GORUNSUN.
 *  Gorunmeyen yapisma en sinir bozucu ozelliktir - parca kendiliginden
 *  kayiyormus gibi durur ve oyuncu neden oldugunu bilemez.
 *  tutamaklar() icinde DEGIL, cunku o yalnizca "tasi" modunda calisiyor;
 *  yapisma rampa cizerken de devrede. */
function yapisIzleri() {
  if (calisiyor || kayit) return;
  if (YAPIS.iz.dikey != null) {
    ctx.strokeStyle = "#5ddc8a99"; ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
    cizgi(v(YAPIS.iz.dikey, 0), v(YAPIS.iz.dikey, H));
    ctx.setLineDash([]);
  }
  if (YAPIS.iz.yatay != null) {
    ctx.strokeStyle = "#5ddc8a99"; ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
    cizgi(v(0, YAPIS.iz.yatay), v(W, YAPIS.iz.yatay));
    ctx.setLineDash([]);
  }
  if (YAPIS.iz.nokta) {
    const n = YAPIS.iz.nokta;
    ctx.strokeStyle = "#5ddc8a"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(n.x, n.y, 9, 0, 7); ctx.stroke();
  }
}

/** Tasima modunda: secili parcalarin cercevesi, tutamaklar ve secim kutusu. */
function tutamaklar() {
  if (secili !== "tasi" || calisiyor || kayit) return;
  // Silinen parcalar secimde asili kalmasin
  if (secimler.some(p => !parcalar.includes(p)))
    secimYap(secimler.filter(p => parcalar.includes(p)));

  for (const p of parcalar) {                  // secilmeyenlerde sadece tutus noktasi
    if (seciliMi(p)) continue;
    const m = p.p || v((p.a.x + p.b.x) / 2, (p.a.y + p.b.y) / 2);
    ctx.fillStyle = "#ffffff44";
    ctx.beginPath(); ctx.arc(m.x, m.y, 3.5, 0, 7); ctx.fill();
  }

  // Secili olan HER parca cerceveleniyor; tutamaklar yalnizca tek secimde.
  for (const p of secimler) {
    const sg = geometri(p);
    ctx.strokeStyle = secimler.length > 1 ? "#ffd479aa" : "#ffffff55";
    ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
    if (sg) cizgi(sg[0], sg[1]);
    else { ctx.beginPath(); ctx.arc(p.p.x, p.p.y, uzunu(p) * 0.5 + 10, 0, 7); ctx.stroke(); }
    ctx.setLineDash([]);
  }

  if (kutuSecim) {
    const { a, b } = kutuSecim;
    ctx.strokeStyle = "#ffd479"; ctx.fillStyle = "#ffd4791f";
    ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.rect(Math.min(a.x, b.x), Math.min(a.y, b.y),
             Math.abs(b.x - a.x), Math.abs(b.y - a.y));
    ctx.fill(); ctx.stroke();
    ctx.setLineDash([]);
  }

  if (!secim) return;
  for (const t of tutamakNoktalari(secim)) {
    ctx.fillStyle = t.tur === "olcu" ? "#f4a261" : "#ffffff";
    ctx.beginPath(); ctx.arc(t.nok.x, t.nok.y, 6, 0, 7); ctx.fill();
    ctx.strokeStyle = "#0e1015"; ctx.lineWidth = 2; ctx.stroke();
  }
}

/** Noktadaki parcanin indisi (yoksa -1). Silme ve nota menusu ayni testi kullanir. */
function parcaBul(p) {
  for (let i = parcalar.length - 1; i >= 0; i--) {
    const seg = geometri(parcalar[i]);
    const yakin = seg
      ? boy(cikar(p, enYakin(p, seg[0], seg[1]).nok)) < yakalamaPayi(16)
      : boy(cikar(p, parcalar[i].p)) < yakalamaPayi(26);   // alan etkili parcalar
    if (yakin) return i;
  }
  return -1;
}

function silNoktada(p) {
  const i = parcaBul(p);
  if (i >= 0) { parcalar.splice(i, 1); kaydet(); paletCiz(); }
}

/* ---------- cogaltma ---------- */

const COGALT_KAYMA = 30;   // kopya orijinalin ustune binmesin diye kaydirma (px)

/** Parcanin kopyasi: nokta alanlari (p/a/b) kaydirilir, gerisi aynen gecer.
 *  Tasimadaki gibi tur ISMEN bilinmiyor — hangi alanlarin nokta oldugu
 *  `noktalari()` ile bulunuyor, yani yeni parca turu ayrica kod istemiyor. */
function parcaKopyala(p, dx, dy) {
  const k = {};
  for (const ad of Object.keys(p)) {
    const d = p[ad];
    k[ad] = d && typeof d === "object" && typeof d.x === "number" ? v(d.x, d.y) : d;
  }
  const alanlar = noktalari(k);
  let sx = dx, sy = dy;                        // kopya da tahtanin icinde kalsin
  for (const ad of alanlar) {
    sx = kis(sx, -k[ad].x + 4, W - 4 - k[ad].x);
    sy = kis(sy, -k[ad].y + 4, H - 4 - k[ad].y);
  }
  for (const ad of alanlar) { k[ad].x += sx; k[ad].y += sy; }
  return k;
}

/** ⧉ aracinda: tiklanan parcayi cogaltip kopyayi imlece baglar. */
function cogaltNoktada(nok, e) {
  const i = parcaBul(nok);
  if (i < 0) { ipucGoster(T("cogaltYok")); return; }
  const k = cogalt(parcalar[i]);
  if (!k) return;
  // Kopya dogrudan surukleniyor: birakilan yer kullanicinin sectigi yer olur.
  tasima = { p: k, kavrama: "butun", son: nok };
  yakala(e);
}

/** Parcayi acisi, boyu ve notasiyla birlikte kopyalar. Kopya secili gelir. */
function cogalt(p) {
  if (stokKalan(p.tur) < 1) { ipucGoster(T("stokBitti")); return null; }
  const k = parcaKopyala(p, COGALT_KAYMA, COGALT_KAYMA);
  parcalar.push(k);
  kaydet();

  ipucGoster(T("cogaltIpuc", pT(k.tur, "ad")));
  return k;
}

const ANAHTAR = i => "rube-bolum-" + (BOLUMLER[i].id != null ? BOLUMLER[i].id : i);
/** Ekrandaki paylasma linkini gizle. Makine degisince cagriliyor: link

/* ---------- paylasma linki ---------- *
 *
 *  Makine URL'nin HASH'ine gomuluyor. Hash bilerek secildi: sunucuya hic
 *  gonderilmez, yani arka uc olmadan calisir, file:// ile de calisir ve
 *  sunucularin URL uzunlugu sinirlarina takilmaz.
 *
 *  Gelen link YABANCI VERI. Icindeki her sey dogrulanmadan motora
 *  verilemez: tek bir NaN koordinat fizigi sessizce kilitler ve hata
 *  linkte degil oyunda ariyormus gibi gorunur.
 * ---------------------------------------------------------------- */

const PAYLAS_SURUM = 1;
const PAYLAS_AZAMI = 300;              // link basina parca tavani

/** Baskasinin makinesini mi goruyoruz? Doluysa kaydet() susar. */
let misafir = null;

function b64Yaz(bayt) {
  let s = "";
  for (const b of bayt) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64Oku(s) {
  const d = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
  const bayt = new Uint8Array(d.length);
  for (let i = 0; i < d.length; i++) bayt[i] = d.charCodeAt(i);
  return bayt;
}

/** deflate-raw ile sikistir/ac. Tarayicida yoksa null doner, duz base64'e
    dusuluyor - link uzar ama calisir. */
async function _akit(bayt, sinifAd, kip) {
  const Sinif = globalThis[sinifAd];
  if (typeof Sinif !== "function") return null;
  try {
    const akis = new Blob([bayt]).stream().pipeThrough(new Sinif(kip));
    return new Uint8Array(await new Response(akis).arrayBuffer());
  } catch (e) { return null; }
}

async function makineKodu() {
  const veri = { s: PAYLAS_SURUM, b: BOLUMLER[bolumNo].id, p: parcalar };
  const ham = new TextEncoder().encode(JSON.stringify(veri));
  const sik = await _akit(ham, "CompressionStream", "deflate-raw");
  // Sikistirma kazanc saglamadiysa duz halini yolla; bayrak ilk karakterde.
  return sik && sik.length < ham.length ? "1" + b64Yaz(sik) : "0" + b64Yaz(ham);
}

const _sayiMi = x => typeof x === "number" && isFinite(x);

/** Gelen parca listesini suz. Her parca PARCALAR'daki `olustur` ile SIFIRDAN
    kuruluyor, sonra dogrulanmis alanlar uzerine yaziliyor: boylece nesnenin
    sekli motorun bekledigi sekil oluyor, linkte ne yazarsa yazsin. */
function makineSuz(dizi) {
  if (!Array.isArray(dizi)) return null;
  const cikti = [];
  for (const ham of dizi.slice(0, PAYLAS_AZAMI)) {
    if (!ham || typeof ham !== "object") continue;
    const tanimi = PARCALAR[ham.tur];
    if (!tanimi || !tanimi.olustur) continue;

    const nok = {};
    let bozuk = false;
    for (const k of ["p", "a", "b"]) {
      const n = ham[k];
      if (n == null) continue;
      if (typeof n !== "object" || !_sayiMi(n.x) || !_sayiMi(n.y)) { bozuk = true; break; }
      nok[k] = v(kis(n.x, 0, W), kis(n.y, 0, H));
    }
    if (bozuk) continue;
    const kok = nok.p || nok.a;
    if (!kok) continue;

    const p = tanimi.olustur(kok, nok.b || kok);
    if (!p || p.tur !== ham.tur) continue;      // olustur baska tur uretirse birak
    for (const k of ["p", "a", "b"]) if (nok[k] && p[k]) p[k] = nok[k];

    if (_sayiMi(ham.yon)) p.yon = ham.yon;
    if (_sayiMi(ham.uzun) && tanimi.sekil) {
      p.uzun = kis(ham.uzun, tanimi.sekil.enAz, tanimi.sekil.enCok);
    }
    if (typeof ham.nota === "string" && NOTALAR.some(n => n.ad === ham.nota)) {
      p.nota = ham.nota;
    }
    cikti.push(p);
  }
  return cikti;
}

async function koduCoz(kod) {
  if (typeof kod !== "string" || kod.length < 2) return null;
  try {
    const bayt = b64Oku(kod.slice(1));
    const ham = kod[0] === "1"
      ? await _akit(bayt, "DecompressionStream", "deflate-raw") : bayt;
    if (!ham) return null;
    const veri = JSON.parse(new TextDecoder().decode(ham));
    if (!veri || veri.s !== PAYLAS_SURUM) return null;
    const i = BOLUMLER.findIndex(b => b.id === veri.b);
    if (i < 0) return null;                     // bilinmeyen bolum: sessizce alma
    const parca = makineSuz(veri.p);
    return parca && parca.length ? { bolum: i, parcalar: parca } : null;
  } catch (e) { return null; }
}

function paylasBaglantisi(kod) {

async function paylas() {

  } catch (e) {

    try { kutu.select(); kopyalandi = document.execCommand("copy"); } catch (e2) {}

  if (!e) return false;

  if (!sonuc) { ipucGoster(T("paylasBozuk")); return false; }

/** Secili parcalari (dx,dy) kadar kaydirir; yigin tahtanin icinde kalir. */
function kaydirSecim(dx, dy) {
  let sx = dx, sy = dy;
  for (const q of secimler)
    for (const alan of noktalari(q)) {
      sx = kis(sx, -q[alan].x + 4, W - 4 - q[alan].x);
      sy = kis(sy, -q[alan].y + 4, H - 4 - q[alan].y);
    }
  for (const q of secimler) {
    for (const alan of noktalari(q)) { q[alan].x += sx; q[alan].y += sy; }
    if (tanim(q).sifirla) tanim(q).sifirla(q);
  }
}

/** Secimi ortak merkezi etrafinda `da` radyan dondurur.
 *  Iki sey birlikte donmeli: parcanin KONUMU (merkez etrafinda) ve kendi
 *  ACISI (p.yon). Yalnizca konum donseydi yatik bir rampa dizisi dizilim
 *  olarak doner ama her parca yatay kalirdi. */
function dondurSecim(da) {
  if (!secimler.length) return;
  let mx = 0, my = 0, n = 0;
  for (const q of secimler)
    for (const alan of noktalari(q)) { mx += q[alan].x; my += q[alan].y; n++; }
  if (!n) return;
  mx /= n; my /= n;
  const co = Math.cos(da), si = Math.sin(da);
  // Once denemesini yap: tahtadan tasan bir donus HIC uygulanmamali, yoksa
  // parcalar kenara yapisip yigin sekil degistiriyor.
  for (const q of secimler)
    for (const alan of noktalari(q)) {
      const x = q[alan].x - mx, y = q[alan].y - my;
      const nx = mx + x * co - y * si, ny = my + x * si + y * co;
      if (nx < 4 || nx > W - 4 || ny < 4 || ny > H - 4) return;
    }
  for (const q of secimler) {
    for (const alan of noktalari(q)) {
      const x = q[alan].x - mx, y = q[alan].y - my;
      q[alan].x = mx + x * co - y * si;
      q[alan].y = my + x * si + y * co;
    }
    // Tek noktayla konumlanan parcalarin yonu p.yon'da: konumu dondurmek
    // yetmiyor, kendi ekseni de donmeli. Rampa gibi iki uclu parcalarda
    // yon zaten uclardan cikiyor, ona dokunma.
    // !! `q.yon != null` YETMEZ: domino/firlatici gibi parcalar varsayilan
    //    olarak yon TASIMIYOR (yonu() 0 kabul ediyor), o yuzden hic donmuyorlardi.
    if (q.p && !q.a) q.yon = yonu(q) + da;
    if (tanim(q).sifirla) tanim(q).sifirla(q);
  }
}

// Alt basiliyken yapisma kapali. Tusun kalkmasini da dinlemek sart, yoksa
// oyuncu Alt'i birakti sanip yapismasiz surukleme yapmaya devam eder.
document.addEventListener("keyup", e => { if (!e.altKey) YAPIS.kapali = false; });
window.addEventListener("blur", () => { YAPIS.kapali = false; });

document.addEventListener("keydown", e => {
  YAPIS.kapali = e.altKey;
  // Kayit sirasinda tek gecerli tus Esc: kaydi BITIRIR ve goruntuyu saklar.
  // Digerleri kapali - bosluk/R kaydin ortasinda simulasyonu oynatirsa
  // cekilen goruntu ile motorun durumu ayrisiyor.
  if (kayit) {
    if (e.key === "Escape") { e.preventDefault(); kayit.dur = true; }
    return;
  }
  if (e.key === " ") { e.preventDefault(); calisiyor ? durdur() : basla(); }
  if (e.key === "r" || e.key === "R") { durdur(); ustGizle(); }

  // Ok tuslari: secili parcalari ince ayarla. Fareyle 1 px tutturmak
  // imkansiz, yapisma da bazen 1-2 px oteye oturuyor - kacis yolu bu.
  const oklar = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (oklar[e.key] && secimler.length) {
    e.preventDefault();
    const [ox, oy] = oklar[e.key];
    const n = e.shiftKey ? 10 : 1;
    kaydirSecim(ox * n, oy * n);
    kaydet();
  }
  // Q/E: secimi kendi ortasi etrafinda dondurur. Tutamak tek parcayi
  // donduruyordu; bir merdivenin tamamini egmek icin karsiligi yoktu.
  if ((e.key === "q" || e.key === "Q" || e.key === "e" || e.key === "E") && secimler.length) {
    e.preventDefault();
    const yon = (e.key === "q" || e.key === "Q") ? -1 : 1;
    dondurSecim(yon * (e.shiftKey ? 15 : 5) * Math.PI / 180);
    kaydet();
  }
  // Delete/Backspace secili parcalari siler. Kutu secimi olmadan bunun
  // karsiligi yoktu: 20 parcayi tek tek silme araciyla tiklamak gerekiyordu.
  if ((e.key === "Delete" || e.key === "Backspace") && secimler.length) {
    e.preventDefault();
    parcalar = parcalar.filter(p => !seciliMi(p));
    secimYap([]);
    kaydet(); paletCiz();
  }
});

try {
  SES.acik = localStorage.getItem("rube-ses") !== "0";

} catch (e) {}

arayuzuTazele();

// makine varsa hemen uzerine biniyor. Sirasi onemli - bolumKur misafirligi

baglantidanAc();
// Sayfa ACIKKEN adres cubuguna link yapistirmak sayfayi YENIDEN YUKLEMEZ -

window.addEventListener("hashchange", baglantidanAc);
